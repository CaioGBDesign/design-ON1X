<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Design System ON1X · Componentes</title>
    <link rel="icon" type="image/jpeg" href="components/Favicon/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #111414;
        --surface: rgba(255, 255, 255, 0.03);
        --line: rgba(255, 255, 255, 0.15);
        --hover: rgba(255, 255, 255, 0.06);
        --text: #ffffff;
        --muted: rgba(255, 255, 255, 0.6);
        --accent: #5fddd3;
        --on-accent: #0a181c;
        --field: #000000;
        font-family:
          "Public Sans",
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        grid-template-columns: 255px 1fr;
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
      }
      /* Esfera de brilho: centro no canto superior direito */
      body::before {
        content: "";
        position: fixed;
        top: -472px;
        right: -472px;
        width: 944px;
        height: 944px;
        aspect-ratio: 1/1;
        border-radius: 944px;
        opacity: 0.2;
        background: #5fddd3;
        filter: blur(400px);
        pointer-events: none;
        z-index: -1;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }

      /* Página no Light */
      body[data-theme="light"] {
        background:
          linear-gradient(
            0deg,
            rgba(95, 221, 211, 0.03) 0%,
            rgba(95, 221, 211, 0.03) 100%
          ),
          #fff;
      }
      body[data-theme="light"]::before {
        display: none;
      }
      body[data-theme="light"] .nav,
      body[data-theme="light"] .toolbar {
        --line: rgba(0, 0, 0, 0.15);
        --muted: #717171;
        color: #000;
      }
      body[data-theme="light"] .nav {
        --hover: rgba(0, 0, 0, 0.06);
        border-right: 1px solid rgba(0, 0, 0, 0.15);
        background: rgba(0, 0, 0, 0.03);
      }
      body[data-theme="light"] .frame {
        border-color: rgba(0, 0, 0, 0.15);
      }
      body[data-theme="light"] .colors-nav {
        --hover: rgba(0, 0, 0, 0.06);
      }
      body[data-theme="light"] .nav-link[aria-current="page"] {
        background: rgba(10, 24, 28, 0.05);
      }
      body[data-theme="light"] .nav-search {
        border-color: rgba(0, 0, 0, 0.15);
        background: #fff;
        color: #000;
      }
      body[data-theme="light"] .nav-search input {
        color: #000;
      }
      body[data-theme="light"] .stage::-webkit-scrollbar-thumb,
      body[data-theme="light"] .drawer-body::-webkit-scrollbar-thumb,
      body[data-theme="light"] pre::-webkit-scrollbar-thumb {
        background-color: rgba(0, 0, 0, 0.3);
      }

      /* Drawer no Light */
      body[data-theme="light"] .drawer {
        --line: rgba(0, 0, 0, 0.15);
        border-left: 1px solid rgba(0, 0, 0, 0.15);
        background: #fff;
        color: #000;
      }
      /* A sombra só existe aberto: fechado, ela vazaria para dentro da tela */
      body[data-theme="light"] .drawer.open {
        box-shadow: -8px 0 24px 0 rgba(0, 0, 0, 0.06);
      }
      body[data-theme="light"] .drawer .icon-btn {
        border-color: rgba(0, 0, 0, 0.15);
        background: rgba(0, 0, 0, 0.02);
        color: #000;
      }
      body[data-theme="light"] .drawer .icon-btn:hover {
        border-color: rgba(0, 0, 0, 0.3);
        background: rgba(0, 0, 0, 0.06);
      }
      body[data-theme="light"] .drawer pre {
        border-color: rgba(0, 0, 0, 0.15);
        background: rgba(0, 0, 0, 0.02);
      }
      body[data-theme="light"] .drawer .code-box:hover pre {
        border-color: rgba(0, 0, 0, 0.3);
        background: rgba(0, 0, 0, 0.06);
      }
      body[data-theme="light"] .knob input:not(.switch, .slider),
      body[data-theme="light"] .knob select {
        border-color: rgba(0, 0, 0, 0.15);
        background: #fff;
        color: #000;
      }
      body[data-theme="light"] .knob .switch:not(:checked) {
        background: #e5e5e5;
      }
      body[data-theme="light"] .knob .switch::before {
        background: #000;
      }
      body[data-theme="light"] .add-item {
        border: 1px solid rgba(0, 0, 0, 0.15);
        color: #000;
      }
      body[data-theme="light"] .add-item:hover {
        border-color: rgba(0, 0, 0, 0.3);
        background: rgba(0, 0, 0, 0.06);
      }

      /* Lateral */
      .nav {
        background: var(--surface);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        min-height: 0;
        height: 100vh;
      }
      .brand {
        padding: 18px 16px;
        font-weight: 600;
        font-size: 15px;
        border-bottom: 1px solid var(--line);
      }
      .brand small {
        display: block;
        font-weight: 400;
        font-size: 12px;
        margin-top: 2px;
        color: #717171;
      }
      .search-box {
        padding: 12px;
      }
      /* Mesmo estilo do componente Search (components/search/search.html) */
      .nav-search {
        display: flex;
        padding: 8px;
        align-items: center;
        gap: 8px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: #000;
        color: #fff;
        cursor: text;
      }
      .nav-search svg {
        flex: none;
      }
      .nav-search input {
        flex: 1;
        min-width: 0;
        padding: 0;
        border: 0;
        background: none;
        outline: none;
        overflow: hidden;
        color: #fff;
        text-overflow: ellipsis;
        font-family: "Public Sans";
        font-size: 12px;
        font-weight: 400;
        line-height: 16px;
      }
      .nav-search input::placeholder {
        color: #717171;
      }
      .nav-search input::-webkit-search-cancel-button {
        display: none;
      }
      .nav-list {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 0 12px 12px;
      }
      .nav-group {
        display: flex;
        min-height: 32px;
        margin: 0;
        padding: 0 8px;
        align-items: center;

        color: #717171;
        font-size: 12px;
      }
      .nav-link[hidden] {
        display: none;
      }
      .nav-link {
        display: flex;
        min-height: 32px;
        padding: 0 8px;
        justify-content: space-between;
        align-items: center;
        gap: 8px;

        border-radius: 8px;

        color: inherit;
        text-decoration: none;
        transition: background 0.15s;
      }
      .nav-link:hover {
        background: var(--hover);
      }
      /* PrimaryContainer: fundo do item ativo */
      .nav-link[aria-current="page"] {
        background: rgba(43, 100, 96, 0.15);
      }
      .nav-link:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .nav-label {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      /* Fundamentos fica separado dos grupos de componentes */
      .nav-section:first-child {
        margin: 0 -12px 8px;
        padding: 0 12px 8px;
        border-bottom: 1px solid var(--line);
      }
      .nav-list .empty {
        padding: 0 8px;
      }

      /* Centro */
      main {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: center;
        padding: 24px 26px;
      }
      .toolbar h1 {
        font-size: 13px;
        font-weight: 400;
        margin: 0 auto 0 0;
      }
      /* Reserva a altura do Segmented, que só entra depois de carregar */
      #theme {
        min-height: 30px;
      }
      .stage {
        display: flex;
        flex: 1;
        min-height: 0;
        padding: 0 26px 26px;
        align-items: flex-start;
        overflow: auto;
      }
      @media (prefers-reduced-motion: no-preference) {
        .stage {
          scroll-behavior: smooth;
        }
      }
      /* Simulador: uma única div com todos os componentes */
      .frame {
        display: flex;
        width: 100%;
        justify-content: center;
        align-items: center;

        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.03);

        /* clip, não hidden: as âncoras do menu não podem rolar o frame */
        overflow: clip;
      }
      .frame[hidden] {
        display: none;
      }
      .frame[data-theme="dark"] {
        --cell-line: rgba(255, 255, 255, 0.08);
        --cell-hover: rgba(255, 255, 255, 0.04);
        color: #fff;
      }
      .frame[data-theme="light"] {
        --cell-line: rgba(0, 0, 0, 0.08);
        --cell-hover: rgba(0, 0, 0, 0.03);
        background: rgba(0, 0, 0, 0.03);
        color: #000;
      }
      .grid {
        display: grid;
        /* O 1px a mais esconde a última linha de cada lado: colada na borda do frame, o tracejado borra */
        width: calc(100% + 1px);
        grid-template-columns: repeat(auto-fill, minmax(256px, 1fr));
        margin: 0 -1px -1px 0;
      }
      /* Sessão de cores */
      .section-view[hidden] {
        display: none;
      }
      .section-view {
        display: flex;
        width: 100%;
        align-items: flex-start;
        gap: 26px;
      }
      /* O menu acompanha a rolagem da tabela */
      .colors-nav {
        position: sticky;
        top: 0;
        flex: none;
        flex-direction: column;
        width: 265px;
        padding: 12px;
        justify-content: flex-start;
        align-items: stretch;
      }
      .colors-frame {
        flex: 1;
        min-width: 0;
      }
      @media (max-width: 1100px) {
        .colors-nav {
          display: none;
        }
      }
      .colors tbody {
        scroll-margin-top: 1px;
        transition: background 0.2s;
      }
      .colors {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
        font-size: 12px;
        line-height: 16px;
      }
      .colors th,
      .colors td {
        padding: 16px;
        border-right: 1px dashed var(--cell-line);
        border-bottom: 1px dashed var(--cell-line);
        font-weight: 400;
        text-align: left;
        vertical-align: top;
      }
      .colors th:last-child,
      .colors td:last-child {
        border-right: none;
      }
      .colors tbody:last-child tr:last-child td {
        border-bottom: none;
      }
      .colors-mode {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .colors .colors-group {
        font-size: 14px;
        font-weight: 600;
      }
      .swatch {
        overflow: hidden;
        border-radius: 8px;
        background: #111414;
        color: #fff;
      }
      .swatch.light {
        border-color: rgba(0, 0, 0, 0.15);
        /*background: #fff;*/
      }
      .swatch {
        cursor: pointer;
      }
      .swatch-color {
        position: relative;
        height: 84px;
      }
      .swatch .copy {
        backdrop-filter: none;
        opacity: 0;
        transition: opacity 0.2s;
      }
      .swatch:hover .copy,
      .swatch .copy:focus-visible {
        opacity: 1;
      }
      @media (hover: none) {
        .swatch .copy {
          opacity: 1;
        }
      }
      .swatch-info {
        display: flex;
        padding: 8px;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 0 8px;
        background: rgba(255, 255, 255, 0.03);
      }
      .swatch-info span:last-child {
        text-align: right;
      }
      .swatch-info small {
        display: block;
        color: #717171;
        font-size: inherit;
      }

      /* Altura do modelo mais alto (Alert dialog Radio): trocar de modelo não mexe na grade */
      .cell {
        display: flex;
        position: relative;
        min-height: 342px;
        padding: 20px 16px;
        flex-direction: column;
        gap: 16px;
        border-right: 1px dashed var(--cell-line);
        border-bottom: 1px dashed var(--cell-line);
        cursor: pointer;
        transition: background 0.2s;
      }
      .cell:hover {
        background: var(--cell-hover);
      }
      /* Marca a célula aberta pelo menu: a da última linha não chega ao topo */
      .highlight,
      .cell.highlight {
        background: rgba(43, 100, 96, 0.15);
      }
      .tooltip {
        position: fixed;
        z-index: 30;
        padding: 4px 8px;
        transform: translate(-50%, calc(-100% - 8px));

        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: #000;

        color: #fff;
        font-size: 12px;
        line-height: 16px;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.15s;
      }
      .tooltip.show {
        opacity: 1;
      }
      .cell-head {
        display: flex;
        min-height: 32px;
        align-items: center;
        gap: 8px;
      }
      /* O select e o botão de editar só aparecem com o hover na célula. Eles seguem ocupando
         espaço, para nada pular, e também aparecem no foco do teclado e com o select aberto. */
      .cell-head .cell-select,
      .cell-head .icon-btn,
      .cell .copy {
        opacity: 0;
        transition:
          opacity 0.2s,
          background 0.15s,
          border-color 0.15s;
      }
      /* Aqui não há texto atrás do ícone: o desfoque só marcaria o fundo */
      .cell .copy {
        backdrop-filter: none;
      }
      .cell:hover .cell-head .cell-select,
      .cell:hover .cell-head .icon-btn,
      .cell:hover .copy,
      .cell-head .cell-select:has(:focus-visible),
      .cell-head .cell-select.open,
      .cell-head .icon-btn:focus-visible,
      .cell .copy:focus-visible {
        opacity: 1;
      }
      /* Sem mouse não existe hover: os controles ficam sempre visíveis */
      @media (hover: none) {
        .cell-head .cell-select,
        .cell-head .icon-btn,
        .cell .copy {
          opacity: 1;
        }
      }
      .cell-title {
        flex: 1 1 auto;
        min-width: 0;
      }

      /* Select de modelos da célula */
      .cell-select {
        position: relative;
        flex: 0 1 auto;
        min-width: 96px;
        font-size: 12px;
        line-height: 16px;
      }
      .cell-select-btn {
        display: flex;
        width: 100%;
        padding: 8px 4px 8px 8px;
        align-items: center;
        gap: 4px;

        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.02);
        cursor: pointer;
      }
      .cell-select-btn span {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-align: left;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .cell-select-btn svg {
        flex: none;
        transition: transform 0.15s;
      }
      .cell-select.open .cell-select-btn {
        background: #000;
      }
      .cell-select.open .cell-select-btn svg {
        transform: rotate(180deg);
      }
      .cell-select-menu {
        display: none;
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        z-index: 15;
        min-width: 100%;
        width: max-content;
        margin: 0;
        padding: 4px;
        list-style: none;

        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: #000;
        box-shadow: 0 4px 10px 0 rgba(0, 0, 0, 0.15);
      }
      .cell-select.open .cell-select-menu {
        display: block;
      }
      .cell-select-menu button {
        display: block;
        width: 100%;
        padding: 8px;
        border: 0;
        border-radius: 6px;
        background: none;
        font-size: inherit;
        line-height: inherit;
        text-align: left;
        cursor: pointer;
      }
      .cell-select-menu button:hover,
      .cell-select-menu button:focus-visible,
      .cell-select-menu button[aria-current="true"] {
        background: rgba(255, 255, 255, 0.08);
        outline: none;
      }
      body[data-theme="light"] .cell-select-btn {
        border-color: rgba(0, 0, 0, 0.15);
        background: rgba(0, 0, 0, 0.02);
      }
      body[data-theme="light"] .cell-select.open .cell-select-btn {
        background: #fff;
      }
      body[data-theme="light"] .cell-select-menu {
        border-color: rgba(0, 0, 0, 0.15);
        background: #fff;
      }
      body[data-theme="light"] .cell-select-menu button:hover,
      body[data-theme="light"] .cell-select-menu button:focus-visible,
      body[data-theme="light"] .cell-select-menu button[aria-current="true"] {
        background: rgba(0, 0, 0, 0.08);
      }
      /* No drawer, o select ocupa a largura toda */
      #variant .cell-select {
        width: 100%;
      }
      .cell-body {
        display: flex;
        flex: 1;
        min-width: 0;
        justify-content: center;
        align-items: center;
      }
      /* Mantém o tamanho do componente mesmo que ele peça para esticar */
      .cell .cell-body > * {
        align-self: center;
      }
      /* Na grade, o Radio sem label mostra um único botão */
      .cell-body .radio-group:not(:has(span)) .radio-label + .radio-label {
        display: none;
      }

      /* Botão só com ícone: mesmo estilo do botão Glass */
      .icon-btn {
        display: inline-flex;
        flex: none;
        padding: 8px;
        justify-content: center;
        align-items: center;

        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.02);

        color: #ffffff;
        cursor: pointer;
        transition:
          background 0.15s,
          border-color 0.15s;
      }
      .icon-btn:hover {
        border-color: rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.08);
      }
      .icon-btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .frame[data-theme="light"] .icon-btn {
        border-color: rgba(0, 0, 0, 0.15);
        background: rgba(0, 0, 0, 0.02);
        color: #000;
      }
      .frame[data-theme="light"] .icon-btn:hover {
        border-color: rgba(0, 0, 0, 0.3);
        background: rgba(0, 0, 0, 0.06);
      }

      /* Drawer de detalhes */
      .backdrop {
        position: fixed;
        inset: 0;
        z-index: 19;
        background: rgba(0, 0, 0, 0.25);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
      }
      .backdrop.open {
        opacity: 1;
        pointer-events: auto;
      }
      .drawer {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        z-index: 20;
        display: flex;
        width: 452px;
        max-width: 100vw;
        flex-direction: column;
        border-left: 1px solid var(--line);
        background: #000;
        transform: translateX(100%);
        transition: transform 0.2s ease;
      }
      .drawer.open {
        transform: translateX(0);
      }
      .drawer-head {
        display: flex;
        padding: 16px 20px;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--line);
      }
      .drawer-head h2 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
      }
      .drawer-body {
        flex: 1;
        min-height: 0;
        overflow: auto;
      }
      .drawer-body section {
        padding: 16px 20px;
      }
      /* Só a descrição tem a linha embaixo */
      .drawer-body section:first-child {
        border-bottom: 1px solid var(--line);
      }
      .drawer-foot[hidden] {
        display: none;
      }
      .drawer-foot {
        display: flex;
        padding: 16px 20px;
        justify-content: flex-end;
      }
      /* Mesmo estilo do botão Glow Small (components/botoes/Glow/small.html) */
      .apply {
        display: inline-flex;
        padding: 8px;
        justify-content: center;
        align-items: center;
        gap: 8px;

        border: none;
        border-radius: 8px;
        background: #5fddd3;

        color: #0a181c;
        font-family: "Public Sans";
        font-size: 12px;
        font-style: normal;
        font-weight: 400;
        line-height: 16px;
        cursor: pointer;
        transition: background 0.15s;
      }
      .apply:hover {
        background: #7fe6de;
      }
      .apply:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .preview-box {
        overflow: hidden;
        border-radius: 8px;
        border: 1px solid var(--line);
      }
      .preview-box iframe {
        display: block;
        width: 100%;
        height: 140px;
        border: 0;
      }
      .section-title {
        font-size: 13px;
        margin: 0 0 8px;
      }
      .desc {
        margin: 0;
        color: #717171;
        font-size: 13px;
        line-height: 1.25;
      }
      /* Colunas: nome, campo, toggle. Todas as linhas ficam alinhadas entre si. */
      #knobs {
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr) auto;
        gap: 16px 12px;
        align-items: center;
      }
      .knob {
        display: contents;
      }
      .knob > span {
        grid-column: 1;
      }
      .knob > input,
      .knob > select {
        grid-column: 2 / 4;
      }
      .knob.no-label > input,
      .knob.no-label > select {
        grid-column: 1 / 4;
      }
      .knob-row > input[type="text"] {
        grid-column: 2;
      }
      /* Mesmo estilo do componente Input text (components/inputs/input-text) */
      .knob input,
      .knob select {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: #000;
        outline: none;

        overflow: hidden;
        color: #fff;
        text-overflow: ellipsis;
        font-family: "Public Sans";
        font-size: 12px;
        font-style: normal;
        font-weight: 400;
        line-height: 16px;
      }
      .knob input::placeholder {
        color: #717171;
      }
      /* Mesmo estilo do componente Toggle (components/toggle/default.html) */
      .knob .switch {
        display: flex;
        grid-column: 3;
        justify-self: end;
        width: 40px;
        height: 20px;
        flex: none;
        box-sizing: border-box;
        margin: 0;
        padding: 4px;
        align-items: center;
        gap: 8px;

        appearance: none;
        border: 0;
        border-radius: 40px;
        background: #262626;
        cursor: pointer;
        transition: background 0.15s;
      }
      .knob .switch::before {
        content: "";
        width: 10px;
        height: 6px;
        transform: rotate(-180deg);
        flex-shrink: 0;

        border-radius: 4px;
        background: #fff;
        transition: transform 0.15s;
      }
      .knob .switch:checked {
        background: #5fddd3;
      }
      .knob .switch:checked::before {
        transform: translateX(22px) rotate(-180deg);
      }
      .knob .switch:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .knob .slider {
        grid-column: 2;
        height: 20px;
        padding: 0;
        overflow: visible;

        border: 0;
        background: none;
        accent-color: #5fddd3;
        cursor: pointer;
      }
      .knob .slider:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .knob-value {
        grid-column: 3;
        justify-self: end;
        font-size: 12px;
        line-height: 16px;
      }
      /* Mesmo estilo do botão Outline Small (components/botoes/Outline/small.html) */
      .add-item {
        display: inline-flex;
        grid-column: 1 / 4;
        justify-self: end;
        padding: 8px;
        justify-content: center;
        align-items: center;
        gap: 8px;

        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: none;

        color: #fff;
        font-family: "Public Sans";
        font-size: 12px;
        font-style: normal;
        font-weight: 400;
        line-height: 16px;
        cursor: pointer;
        transition:
          background 0.15s,
          border-color 0.15s;
      }
      .add-item:hover {
        border-color: rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.06);
      }
      .add-item:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .empty {
        grid-column: 1 / -1;
        color: var(--muted);
        margin: 0;
      }
      /* Clicar em qualquer parte do código copia; o ícone indica a ação */
      .code-box {
        position: relative;
        cursor: pointer;
      }
      .copy {
        display: inline-flex;
        position: absolute;
        right: 12px;
        bottom: 12px;
        padding: 8px;

        border: none;
        border-radius: 8px;
        background: none;
        backdrop-filter: blur(12px);

        color: inherit;
        cursor: pointer;
      }
      .copy:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .code-box:hover pre {
        border-color: rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.08);
      }
      pre {
        display: flex;
        height: 313px;
        box-sizing: border-box;
        margin: 0;
        padding: 8px;
        align-items: flex-start;
        gap: 8px;
        align-self: stretch;

        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.02);

        color: #717171;
        font-family: inherit;
        font-size: 12px;
        line-height: 1.25;
        white-space: pre-wrap;
        word-break: break-word;
        overflow: auto;
        transition:
          background 0.15s,
          border-color 0.15s;
      }
      /* Scrollbar fina e arredondada, sem trilho, afastada das bordas */
      pre::-webkit-scrollbar,
      .drawer-body::-webkit-scrollbar,
      .stage::-webkit-scrollbar {
        width: 14px;
        height: 14px;
      }
      pre::-webkit-scrollbar-track,
      .drawer-body::-webkit-scrollbar-track,
      .stage::-webkit-scrollbar-track {
        background: transparent;
        margin: 8px 0;
      }
      pre::-webkit-scrollbar-thumb,
      .drawer-body::-webkit-scrollbar-thumb,
      .stage::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.6);
        background-clip: padding-box;
        border: 4px solid transparent;
        border-radius: 999px;
      }
      pre::-webkit-scrollbar-thumb:hover,
      .drawer-body::-webkit-scrollbar-thumb:hover,
      .stage::-webkit-scrollbar-thumb:hover {
        background-color: rgba(255, 255, 255, 0.8);
      }
      /* Firefox não aceita os estilos acima; usa a versão fina na mesma cor */
      @supports (-moz-appearance: none) {
        pre,
        .drawer-body,
        .stage {
          scrollbar-width: thin;
          scrollbar-color: rgba(255, 255, 255, 0.6) transparent;
        }
      }

      /* Em telas grandes a grade fica sempre em 5 colunas */
      @media (min-width: 1600px) {
        .grid {
          grid-template-columns: repeat(5, minmax(0, 1fr));
        }
      }
      @media (max-width: 1100px) {
        body {
          grid-template-columns: 220px 1fr;
        }
      }
    </style>
  </head>

    <div class="tooltip" id="tooltip" role="status">HTML copiado</div>

    <script>
      const $ = (id) => document.getElementById(id);
      const state = {
        list: [],
        current: null, // componente aberto no drawer
        cell: null, // célula da grade que abriu o drawer
        opener: null, // botão que abriu o drawer
        raw: "",
        values: {}, // edição em andamento no drawer
        drafts: {}, // edições dos outros modelos enquanto o drawer está aberto
        applied: {}, // valores mostrados na grade, por componente
        variant: {}, // modelo escolhido no select de cada célula
        colors: null, // conteúdo do colors.json
        section: null, // sessão aberta no lugar da grade
        theme: "dark",
      };
      const cache = {};

      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );

      // {{#nome}}...{{/nome}} só aparece com o toggle ligado; {{^nome}}...{{/nome}}, só desligado.
      // {{@nome}}...{{/nome}} em linhas próprias repete o trecho para cada item da lista.
      function render(raw, values) {
        const CUT = "\u0000";
        const section =
          /\{\{([#^])\s*(\w+)\s*\}\}([\s\S]*?)\{\{\/\s*\2\s*\}\}/g;
        const list =
          /^([ \t]*)\{\{@\s*(\w+)\s*\}\}([\s\S]*?)\{\{\/\s*\2\s*\}\}/gm;
        let out = raw.replace(list, (_, indent, k, inner) => {
          const items = (values[k] || []).map((item) =>
            render(inner, { ...values, ...item }),
          );
          return items.length ? indent + items.join(`\n${indent}`) : CUT;
        });
        for (let prev; prev !== out; ) {
          prev = out;
          out = out.replace(section, (_, type, k, inner) =>
            !!values[k] === (type === "#") ? inner : CUT,
          );
        }
        return out
          .replace(
            new RegExp(`^[ \\t${CUT}]*${CUT}[ \\t${CUT}]*\\r?\\n`, "gm"),
            "",
          )
          .replaceAll(CUT, "")
          .replace(/\{\{\s*(\w+)\s*\}\}/g, (_, k) => esc(values[k] ?? ""))
          .trim();
      }

      // O HTML copiado é colado fora do site: as imagens precisam do endereço completo.
      const absoluteSrc = (html) =>
        html.replace(
          /src="(components\/[^"]+)"/g,
          (_, path) => `src="${new URL(path, location.href)}"`,
        );

      function copyText() {
        return absoluteSrc(render(state.raw, state.values));
      }

      const PREVIEW_BG = {
        dark: "rgba(255, 255, 255, 0.03)",
        light: "rgba(0, 0, 0, 0.03)",
      };

      // A prévia fica em um iframe: assim os scripts e os estilos do componente
      // não se misturam com os da grade, que mostra o mesmo componente.
      function previewDoc() {
        return `<!doctype html><html data-theme="${state.theme}"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html{height:100%;overflow:hidden;background:${PREVIEW_BG[state.theme]};}
body{display:flex;height:100%;margin:0;padding:16px;overflow:auto;box-sizing:border-box;}
#component{display:flex;width:100%;margin:auto;justify-content:center;align-items:center;}
::-webkit-scrollbar{width:14px;height:14px;}
::-webkit-scrollbar-track{background:transparent;margin:8px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.6);background-clip:padding-box;border:4px solid transparent;border-radius:999px;}
[data-theme="light"] ::-webkit-scrollbar-thumb{background-color:rgba(0,0,0,.3);}
</style></head><body><div id="component">${copyText()}</div></body></html>`;
      }

      // A prévia acompanha a altura do componente, até o limite de 420px. Um menu que abre
      // dentro dela conta na altura, e o componente sobe para o menu caber embaixo dele.
      function fitContent(frame, content) {
        content.style.marginTop = "";
        const open = content.scrollHeight > content.offsetHeight;
        content.style.marginTop = open ? "0" : "";
        frame.style.height = `${Math.min(Math.max(content.scrollHeight + 32, 140), 420)}px`;
      }

      function fitPreview() {
        const frame = $("preview");
        const content = frame.contentDocument?.getElementById("component");
        if (content) {
          fitContent(frame, content);
          new frame.contentWindow.MutationObserver(() =>
            fitContent(frame, content),
          ).observe(content, {
            attributes: true,
            attributeFilter: ["class"],
            subtree: true,
          });
          // O menu animado só muda de tamanho de vez quando a animação termina.
          content.addEventListener("transitionend", () =>
            fitContent(frame, content),
          );
        }
        // Com o foco dentro da prévia, o Esc não chega à página.
        frame.contentDocument?.addEventListener("keydown", (e) => {
          if (e.key === "Escape") closeDrawer();
        });
        // Clique dentro do iframe não chega à página, que fecharia o select.
        frame.contentDocument?.addEventListener("click", () =>
          closeCellSelects(),
        );
      }

      let previewTimer;
      function update() {
        $("code").textContent = copyText();
        clearTimeout(previewTimer);
        previewTimer = setTimeout(() => {
          $("preview").srcdoc = previewDoc();
        }, 120);
      }

      // Ignora acentos e maiúsculas: "botoes" encontra "Botões".
      const plain = (s) =>
        s.normalize("NFD").replace(/\p{M}/gu, "").toLowerCase();

      // Filtra só o menu da lateral: a grade não muda.
      function searchNav() {
        const q = plain($("search").value.trim());
        let found = 0;
        document.querySelectorAll(".nav-section").forEach((section) => {
          const links = [...section.querySelectorAll(".nav-link")];
          links.forEach((a) => (a.hidden = !a.dataset.search.includes(q)));
          const visible = links.filter((a) => !a.hidden).length;
          section.hidden = !visible;
          found += visible;
        });
        $("nav-empty").hidden = found > 0;
      }

      // Componentes em ordem alfabética (ignora acentos e maiúsculas).
      const byName = (a, b) =>
        a.localeCompare(b, "pt-BR", { sensitivity: "base", numeric: true });

      const EDIT_ICON =
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/></svg>';

      const PLUS_ICON =
        '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3.33334 8H12.6667" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor"/><path d="M8 3.33333V12.6667" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor"/></svg>';

      const COPY_ICON =
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';

      const PALETTE_ICON =
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z"/><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/></svg>';

      const MOON_ICON =
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';

      const SUN_ICON =
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';

      const ARROW_ICON =
        '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 6L8 10L12 6" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor"/></svg>';

      // Cada entrada com "grid" no components.json vira uma célula da grade.
      const cells = () =>
        state.list
          .filter((c) => c.grid)
          .sort((a, b) => byName(a.grid.title, b.grid.title));

      const byId = (id) => state.list.find((x) => x.id === id);

      // Grupos do menu da lateral, vindos de "grid.group" no components.json.
      const NAV_GROUPS = [
        "Feedback",
        "Ações",
        "Formulários",
        "Exibição",
        "Outros",
      ];
      const navLabel = (c) => c.grid.navTitle ?? c.grid.title;

      // Sessões do grupo Fundamentos: cada uma abre no lugar da grade.
      const SECTIONS = [
        {
          id: "cores",
          label: "Cores",
          icon: PALETTE_ICON,
          render: renderColors,
        },
      ];

      // Modelos do select da célula, vindos de "grid.options" no components.json.
      const optionsOf = (c) =>
        [...(c.grid.options || [])].sort((a, b) => byName(a.label, b.label));

      function cellSelect(c, shown) {
        const options = optionsOf(c);
        if (!options.length) return "";
        const items = options
          .map(
            (o) =>
              `<li><button type="button" data-variant="${esc(o.id)}" aria-current="${o.id === shown.id}">${esc(o.label)}</button></li>`,
          )
          .join("");
        const current = options.find((o) => o.id === shown.id);
        return `<div class="cell-select"><button class="cell-select-btn" type="button" aria-expanded="false" aria-label="Modelo de ${esc(c.grid.title)}"><span>${esc(current.label)}</span>${ARROW_ICON}</button><ul class="cell-select-menu">${items}</ul></div>`;
      }

      function setCellSelect(box, open) {
        box.classList.toggle("open", open);
        box
          .querySelector(".cell-select-btn")
          .setAttribute("aria-expanded", open);
      }

      function bindCellSelect(box, pick) {
        box.querySelector(".cell-select-btn").onclick = () =>
          setCellSelect(box, !box.classList.contains("open"));
        box.querySelectorAll("[data-variant]").forEach((b) => {
          b.onclick = () => pick(b.dataset.variant);
        });
      }

      function closeCellSelects(except) {
        document.querySelectorAll(".cell-select.open").forEach((box) => {
          if (box !== except) setCellSelect(box, false);
        });
      }

      const CELL_CONTROLS =
        "button, input, select, textarea, label, a, .cell-select, .menu";

      function renderGrid() {
        const grid = $("grid");
        grid.innerHTML = "";
        cells().forEach((c) => {
          const shown = byId(state.variant[c.id] ?? c.id);
          const cell = document.createElement("article");
          cell.className = "cell";
          cell.id = `cell-${c.id}`;
          cell.dataset.cell = c.id;
          cell.innerHTML = `<header class="cell-head"><span class="cell-title">${esc(c.grid.title)}</span>${cellSelect(c, shown)}<button class="icon-btn" type="button" data-edit="${esc(shown.id)}" aria-label="Editar ${esc(c.grid.title)}" title="Editar">${EDIT_ICON}</button></header><div class="cell-body">${render(cache[shown.file], state.applied[shown.id])}</div><button class="copy" type="button" aria-label="Copiar HTML de ${esc(c.grid.title)}" title="Copiar HTML">${COPY_ICON}</button>`;
          cell.querySelector("[data-edit]").onclick = (e) =>
            openDrawer(c, shown, e.currentTarget);
          cell.querySelector(".copy").onclick = (e) => copyCell(shown, e);
          cell.onclick = (e) => {
            // Controles do componente e do cabeçalho seguem funcionando sem copiar.
            if (
              e.target.closest(CELL_CONTROLS) ||
              document.querySelector(".cell .open")
            )
              return;
            copyCell(shown, e);
          };
          const box = cell.querySelector(".cell-select");
          if (box) {
            bindCellSelect(box, (id) => {
              state.variant[c.id] = id;
              renderGrid();
              document
                .querySelector(`[data-edit="${id}"]`)
                .closest(".cell")
                .querySelector(".cell-select-btn")
                .focus();
            });
          }
          grid.appendChild(cell);
          // Script inserido por innerHTML não roda: recria para o componente funcionar.
          cell.querySelectorAll("script").forEach((old) => {
            const s = document.createElement("script");
            s.textContent = old.textContent;
            old.replaceWith(s);
          });
        });
      }

      function renderNav() {
        const foundations = SECTIONS.map(
          (s) =>
            `<a class="nav-link" href="#${s.id}" data-search="${esc(plain(`${s.label} fundamentos`))}"><span class="nav-label">${s.icon}${esc(s.label)}</span></a>`,
        ).join("");
        const sections = NAV_GROUPS.map((group) => {
          const links = cells()
            .filter((c) => (c.grid.group ?? "Outros") === group)
            .sort((a, b) => byName(navLabel(a), navLabel(b)))
            .map((c) => {
              const search = plain(`${navLabel(c)} ${c.grid.title} ${group}`);
              // Sem "options", o componente tem só um modelo.
              const count = optionsOf(c).length || 1;
              return `<a class="nav-link" href="#cell-${esc(c.id)}" data-search="${esc(search)}" title="${count} ${count > 1 ? "variações" : "variação"}"><span>${esc(navLabel(c))}</span><span>${count}</span></a>`;
            })
            .join("");
          return links
            ? `<div class="nav-section"><p class="nav-group">${esc(group)}</p>${links}</div>`
            : "";
        }).join("");
        $("nav-list").innerHTML =
          `<div class="nav-section"><p class="nav-group">Fundamentos</p>${foundations}</div>${sections}<p class="empty" id="nav-empty" hidden>Nada encontrado.</p>`;
      }

      // Cor do ícone sobre a amostra, já misturada com o fundo escuro do card.
      function inkOn(hex, opacity) {
        const [r, g, b] = [1, 3, 5].map((i) => {
          const channel = parseInt(hex.slice(i, i + 2), 16);
          return (channel * opacity + 0x13 * (100 - opacity)) / 100;
        });
        return 0.299 * r + 0.587 * g + 0.114 * b > 128 ? "#0A181C" : "#FFFFFF";
      }

      // Uma amostra de cor: "tone" aponta para a paleta do colors.json
      // ou traz o hex direto, quando a cor não tem primitiva.
      function swatch(name, mode, tone) {
        const primitive = tone.color in state.colors.palette;
        const hex = primitive ? state.colors.palette[tone.color] : tone.color;
        const opacity = tone.opacity ?? 100;
        const alpha = Math.round(opacity * 2.55)
          .toString(16)
          .padStart(2, "0");
        return `<div class="swatch ${mode}" data-hex="${esc(hex)}"><div class="swatch-color" style="background:${esc(hex + alpha)}"><button class="copy" type="button" style="color:${inkOn(hex, opacity)}" aria-label="Copiar ${esc(hex)}" title="Copiar hexadecimal">${COPY_ICON}</button></div><div class="swatch-info"><span>${esc(name)}<small>${primitive ? esc(tone.color) : "Sem primitiva"}</small></span><span>${esc(hex.slice(1))}${opacity < 100 ? `<small>${opacity}%</small>` : ""}</span></div></div>`;
      }

      const groupId = (group) =>
        `cores-${plain(group.name).replace(/\W+/g, "-")}`;

      function renderColors() {
        const links = state.colors.groups
          .map(
            (group) =>
              `<a class="nav-link" href="#${groupId(group)}"><span>${esc(group.name)}</span><span>${group.roles.length}</span></a>`,
          )
          .join("");
        const groups = state.colors.groups
          .map((group) => {
            const rows = group.roles
              .map(
                (r) =>
                  `<tr><td>${swatch(r.name, "dark", r.dark)}</td><td>${swatch(r.name, "light", r.light)}</td><td>${esc(r.description)}</td></tr>`,
              )
              .join("");
            return `<tbody id="${groupId(group)}"><tr><th class="colors-group" colspan="3" scope="colgroup">${esc(group.name)}</th></tr>${rows}</tbody>`;
          })
          .join("");
        return `<nav class="frame colors-nav" data-theme="${state.theme}" aria-label="Grupos de cores">${links}</nav><div class="frame colors-frame" data-theme="${state.theme}"><table class="colors"><thead><tr><th scope="col"><span class="colors-mode">${MOON_ICON}Dark mode</span></th><th scope="col"><span class="colors-mode">${SUN_ICON}Light mode</span></th><th scope="col">Explicação</th></tr></thead>${groups}</table></div>`;
      }

      // O endereço decide a tela: "#cores" e "#cores-grupo" abrem a sessão; o resto mostra a grade.
      function showView() {
        const section = SECTIONS.find(
          (s) =>
            location.hash === `#${s.id}` ||
            location.hash.startsWith(`#${s.id}-`),
        );
        $("frame").hidden = !!section;
        $("section").hidden = !section;
        $("view-title").textContent = section?.label ?? "Componentes";
        if (section && section !== state.section)
          $("section").innerHTML = section.render();
        state.section = section;
        if (section && location.hash === `#${section.id}`)
          document
            .querySelector(".stage")
            .scrollTo({ top: 0, behavior: "instant" });
        document.querySelectorAll(".nav-link").forEach((a) => {
          if (section && a.hash === `#${section.id}`)
            a.setAttribute("aria-current", "page");
          else a.removeAttribute("aria-current");
        });
      }

      // A rolagem até o destino é a da própria âncora; aqui só marca onde chegou.
      let highlightTimer;
      function highlightCell(e) {
        const link = e.target.closest(".nav-link");
        if (!link) return;
        document
          .querySelector(".cell.highlight")
          ?.classList.remove("highlight");
        const cell = $(link.hash.slice(1));
        if (!cell) return;
        cell.classList.add("highlight");
        clearTimeout(highlightTimer);
        highlightTimer = setTimeout(
          () => cell.classList.remove("highlight"),
          500,
        );
      }

      function makeSwitch(k, store = state.values) {
        const sw = document.createElement("input");
        sw.type = "checkbox";
        sw.className = "switch";
        sw.checked = !!store[k.name];
        sw.setAttribute("aria-label", k.label || k.name);
        sw.onchange = () => {
          store[k.name] = sw.checked;
          if (state.current.knobs.some((x) => x.when === k.name)) renderKnobs();
          update();
        };
        return sw;
      }

      function makeField(k, store = state.values) {
        let field;
        if (k.type === "select") {
          field = document.createElement("select");
          k.options.forEach((o) => field.add(new Option(o, o)));
        } else {
          field = document.createElement("input");
          field.type = "text";
        }
        field.setAttribute("aria-label", k.label || k.name);
        field.value = store[k.name];
        field.oninput = () => {
          store[k.name] = field.value;
          update();
        };
        return field;
      }

      // Knob "range": slider com o valor ao lado. "liveVar" é a variável CSS do componente,
      // aplicada direto na prévia para acompanhar o arraste sem esperar o iframe recarregar.
      function makeRange(k) {
        const range = document.createElement("input");
        range.type = "range";
        range.className = "slider";
        range.min = k.min;
        range.max = k.max;
        range.step = k.step ?? 1;
        range.value = state.values[k.name];
        range.setAttribute("aria-label", k.label || k.name);
        const value = document.createElement("output");
        value.className = "knob-value";
        value.textContent = `${range.value}${k.unit ?? ""}`;
        range.oninput = () => {
          state.values[k.name] = range.value;
          value.textContent = `${range.value}${k.unit ?? ""}`;
          if (k.liveVar) {
            $("preview")
              .contentDocument?.querySelector(`[style*="${k.liveVar}"]`)
              ?.style.setProperty(k.liveVar, value.textContent);
          }
          update();
        };
        return [range, value];
      }

      // Knob "list": uma linha de toggle e texto por item, e o botão que cria mais um.
      function renderList(k, box) {
        const items = state.values[k.name];
        items.forEach((item) => {
          const title = k.itemLabel.replace("{n}", item.n);
          const wrap = document.createElement("label");
          wrap.className = "knob knob-row";
          wrap.innerHTML = `<span>${esc(title)}</span>`;
          wrap.append(
            makeField({ name: "text", label: `Texto: ${title}` }, item),
            makeSwitch({ name: "show", label: title }, item),
          );
          box.appendChild(wrap);
        });
        const add = document.createElement("button");
        add.type = "button";
        add.className = "add-item";
        add.innerHTML = `${PLUS_ICON}${esc(k.label)}`;
        add.onclick = () => {
          const n = k.start + items.length;
          items.push({ n, show: false, text: k.itemText.replace("{n}", n) });
          renderKnobs();
          update();
          box.querySelector(".add-item").focus();
        };
        box.appendChild(add);
      }

      function renderKnobs() {
        const box = $("knobs");
        box.innerHTML = "";
        // "when" esconde o knob enquanto o toggle indicado estiver desligado.
        const knobs = (state.current.knobs || []).filter(
          (k) => !k.when || state.values[k.when],
        );
        if (!knobs.length) {
          box.innerHTML = '<p class="empty">Este componente não tem knobs.</p>';
          return;
        }
        knobs.forEach((k, i) => {
          if (k.type === "list") return renderList(k, box);
          const title = `<span>${esc(k.label || k.name)}</span>`;
          // "hideLabel" logo depois de um toggle vai para a mesma linha dele.
          if (k.hideLabel && knobs[i - 1]?.type === "toggle") return;
          const wrap = document.createElement("label");
          if (k.type === "range") {
            wrap.className = "knob knob-row";
            wrap.innerHTML = title;
            wrap.append(...makeRange(k));
          } else if (k.type === "toggle" && knobs[i + 1]?.hideLabel) {
            wrap.className = "knob knob-row";
            wrap.innerHTML = title;
            wrap.append(makeField(knobs[i + 1]), makeSwitch(k));
          } else if (k.type === "toggle") {
            wrap.className = "knob";
            wrap.innerHTML = title;
            wrap.append(makeSwitch(k));
          } else if (k.hideLabel) {
            wrap.className = "knob no-label";
            wrap.append(makeField(k));
          } else {
            wrap.className = "knob";
            wrap.innerHTML = title;
            wrap.append(makeField(k));
          }
          box.appendChild(wrap);
        });
      }

      // Select de modelos do drawer: troca o componente sem fechar e guarda a edição do anterior.
      function renderVariants() {
        const box = $("variant");
        box.innerHTML = cellSelect(state.cell, state.current);
        $("variant-section").hidden = !box.innerHTML;
        if (!box.innerHTML) return;
        bindCellSelect(box.querySelector(".cell-select"), (id) => {
          state.drafts[state.current.id] = state.values;
          showInDrawer(byId(id));
          box.querySelector(".cell-select-btn").focus();
        });
      }

      function showInDrawer(c) {
        state.current = c;
        state.raw = cache[c.file];
        state.values =
          state.drafts[c.id] ?? structuredClone(state.applied[c.id]);
        $("desc").textContent = c.description || "";
        renderVariants();
        renderKnobs();
        update();
        clearTimeout(previewTimer);
        $("preview").srcdoc = previewDoc();
        $("code").scrollTop = 0;
      }

      function openDrawer(cell, c, opener) {
        state.cell = cell;
        state.opener = opener;
        state.drafts = {};
        showInDrawer(c);
        $("drawer").inert = false;
        $("drawer").classList.add("open");
        $("backdrop").classList.add("open");
        $("close").focus();
      }

      function closeDrawer() {
        $("drawer").inert = true;
        $("drawer").classList.remove("open");
        $("backdrop").classList.remove("open");
        state.opener?.focus();
      }

      // As edições só chegam à grade ao aplicar; fechar descarta.
      // A célula passa a mostrar o modelo que estava aberto no drawer.
      function applyDrawer() {
        const { id } = state.current;
        state.applied[id] = { ...state.values };
        state.variant[state.cell.id] = id;
        renderGrid();
        state.opener = document.querySelector(`[data-edit="${id}"]`);
        closeDrawer();
      }

      async function writeClipboard(text) {
        try {
          await navigator.clipboard.writeText(text);
        } catch {
          const t = document.createElement("textarea");
          t.value = text;
          document.body.appendChild(t);
          t.select();
          document.execCommand("copy");
          t.remove();
        }
      }

      let tooltipTimer;
      // Mostra o tooltip acima do ponto, sem passar da borda direita da tela.
      function showTooltip(x, y, text) {
        const tip = $("tooltip");
        tip.textContent = text;
        const maxX = innerWidth - tip.offsetWidth / 2 - 8;
        tip.style.left = `${Math.min(x, maxX)}px`;
        tip.style.top = `${y}px`;
        tip.classList.add("show");
        clearTimeout(tooltipTimer);
        tooltipTimer = setTimeout(() => tip.classList.remove("show"), 1200);
      }

      // Pelo teclado o clique não tem posição: usa o botão como referência.
      function showCopied(e, text = "HTML copiado") {
        if (e.detail) return showTooltip(e.clientX, e.clientY, text);
        const btn = e.target.getBoundingClientRect();
        showTooltip(btn.left + btn.width / 2, btn.top, text);
      }

      async function copySwatch(e) {
        const box = e.target.closest(".swatch");
        if (!box || String(getSelection())) return;
        await writeClipboard(box.dataset.hex);
        showCopied(e, `${box.dataset.hex} copiado`);
      }

      async function copyCell(c, e) {
        await writeClipboard(
          absoluteSrc(render(cache[c.file], state.applied[c.id])),
        );
        showCopied(e);
      }

      // Usar a barra de rolagem ou selecionar um trecho não copia o HTML todo.
      async function copyFromBox(e) {
        const code = $("code");
        if (e.target === code) {
          const onScrollbar =
            e.offsetX >= code.clientWidth || e.offsetY >= code.clientHeight;
          if (onScrollbar || String(getSelection())) return;
        }
        await writeClipboard(copyText());
        showCopied(e);
      }

      async function init() {
        try {
          state.list = await fetch("components.json").then((r) => r.json());
          state.colors = await fetch("colors.json").then((r) => r.json());
          const load = async (c, values) => {
            cache[c.file] = await fetch(c.file).then((r) => r.text());
            const defaults = (c.knobs || []).map((k) => [
              k.name,
              k.default ?? "",
            ]);
            state.applied[c.id] = {
              ...Object.fromEntries(defaults),
              ...values,
            };
          };
          await Promise.all(
            cells().flatMap((c) => [
              load(c, c.grid.values),
              ...optionsOf(c)
                .filter((o) => o.id !== c.id)
                .map((o) =>
                  load(byId(o.id), { ...c.grid.values, ...o.values }),
                ),
            ]),
          );
        } catch (err) {
          $("grid").innerHTML =
            '<p class="empty" style="padding:20px">Não foi possível carregar os componentes. Abra pelo GitHub Pages ou por um servidor local (o navegador bloqueia o carregamento abrindo o arquivo direto).</p>';
          return;
        }
        // O seletor de tema é o componente Segmented, com "name" próprio para não
        // agrupar seus radios com os do mesmo componente na grade.
        const segmented = byId("toggle-segmented");
        $("theme").innerHTML = render(cache[segmented.file], {
          ...state.applied[segmented.id],
          name: "theme",
        });
        $("theme").addEventListener("change", (e) => {
          state.theme = e.target.value;
          document
            .querySelectorAll(".frame")
            .forEach((frame) => (frame.dataset.theme = state.theme));
          document.body.dataset.theme = state.theme;
        });
        $("code-box").onclick = copyFromBox;
        $("section").onclick = (e) => {
          highlightCell(e);
          copySwatch(e);
        };
        $("search").oninput = searchNav;
        $("nav-list").onclick = highlightCell;
        $("preview").onload = fitPreview;
        $("close").onclick = closeDrawer;
        $("backdrop").onclick = closeDrawer;
        $("apply").onclick = applyDrawer;
        document.addEventListener("keydown", (e) => {
          if (e.key !== "Escape") return;
          // Com um select aberto, o Esc fecha só ele.
          if (document.querySelector(".cell-select.open"))
            return closeCellSelects();
          if ($("drawer").classList.contains("open")) closeDrawer();
        });
        document.addEventListener("click", (e) =>
          closeCellSelects(e.target.closest(".cell-select")),
        );
        renderNav();
        renderGrid();
        // As células só existem agora: o navegador não achou a âncora ao abrir.
        const goToHash = () => {
          showView();
          $(location.hash.slice(1))?.scrollIntoView();
        };
        window.addEventListener("hashchange", goToHash);
        goToHash();
      }
      init();
    </script>
  </body>
</html>
