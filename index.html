<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Design System ON1X · Componentes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #111414;
        --surface: rgba(255, 255, 255, 0.03);
        --line: rgba(255, 255, 255, 0.15);
        --hover: rgba(255, 255, 255, 0.06);
        --text: #ffffff;
        --muted: rgba(255, 255, 255, 0.6);
        --accent: #5fddd3;
        --on-accent: #0a181c;
        --field: #000000;
        font-family:
          "Public Sans",
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        grid-template-columns: 255px 1fr;
        background: var(--bg);
        color: var(--text);
        font-size: 13px;
      }
      /* Esfera de brilho: centro no canto superior direito */
      body::before {
        content: "";
        position: fixed;
        top: -472px;
        right: -472px;
        width: 944px;
        height: 944px;
        aspect-ratio: 1/1;
        border-radius: 944px;
        opacity: 0.2;
        background: #5fddd3;
        filter: blur(400px);
        pointer-events: none;
        z-index: -1;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }

      /* Página no Light */
      body[data-theme="light"] {
        background:
          linear-gradient(
            0deg,
            rgba(95, 221, 211, 0.03) 0%,
            rgba(95, 221, 211, 0.03) 100%
          ),
          #fff;
      }
      body[data-theme="light"]::before {
        display: none;
      }
      body[data-theme="light"] .nav,
      body[data-theme="light"] .toolbar {
        --line: rgba(0, 0, 0, 0.15);
        --muted: #717171;
        color: #000;
      }
      body[data-theme="light"] .nav {
        border-right: 1px solid rgba(0, 0, 0, 0.15);
        background: rgba(0, 0, 0, 0.03);
      }
      body[data-theme="light"] .frame {
        border-color: rgba(0, 0, 0, 0.15);
      }
      body[data-theme="light"] .nav-search {
        border-color: rgba(0, 0, 0, 0.15);
        background: #fff;
        color: #000;
      }
      body[data-theme="light"] .nav-search input {
        color: #000;
      }
      body[data-theme="light"] .filter input {
        border-color: rgba(0, 0, 0, 0.04);
      }
      body[data-theme="light"] .filter input:not(:checked, :indeterminate) {
        background: #e5e5e5;
      }
      body[data-theme="light"] .stage::-webkit-scrollbar-thumb,
      body[data-theme="light"] .drawer-body::-webkit-scrollbar-thumb,
      body[data-theme="light"] pre::-webkit-scrollbar-thumb {
        background-color: rgba(0, 0, 0, 0.3);
      }

      /* Drawer no Light */
      body[data-theme="light"] .drawer {
        --line: rgba(0, 0, 0, 0.15);
        border-left: 1px solid rgba(0, 0, 0, 0.15);
        background: #fff;
        color: #000;
      }
      /* A sombra só existe aberto: fechado, ela vazaria para dentro da tela */
      body[data-theme="light"] .drawer.open {
        box-shadow: -8px 0 24px 0 rgba(0, 0, 0, 0.06);
      }
      body[data-theme="light"] .drawer .icon-btn {
        border-color: rgba(0, 0, 0, 0.15);
        background: rgba(0, 0, 0, 0.02);
        color: #000;
      }
      body[data-theme="light"] .drawer .icon-btn:hover {
        border-color: rgba(0, 0, 0, 0.3);
        background: rgba(0, 0, 0, 0.06);
      }
      body[data-theme="light"] .drawer pre {
        border-color: rgba(0, 0, 0, 0.15);
        background: rgba(0, 0, 0, 0.02);
      }
      body[data-theme="light"] .knob input:not(.switch, .slider),
      body[data-theme="light"] .knob select {
        border-color: rgba(0, 0, 0, 0.15);
        background: #fff;
        color: #000;
      }
      body[data-theme="light"] .knob .switch:not(:checked) {
        background: #e5e5e5;
      }
      body[data-theme="light"] .knob .switch::before {
        background: #000;
      }
      body[data-theme="light"] .add-item {
        border: 1px solid rgba(0, 0, 0, 0.15);
        color: #000;
      }
      body[data-theme="light"] .add-item:hover {
        border-color: rgba(0, 0, 0, 0.3);
        background: rgba(0, 0, 0, 0.06);
      }

      /* Lateral */
      .nav {
        background: var(--surface);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        min-height: 0;
        height: 100vh;
      }
      .brand {
        padding: 18px 16px;
        font-weight: 600;
        font-size: 15px;
        border-bottom: 1px solid var(--line);
      }
      .brand small {
        display: block;
        font-weight: 400;
        font-size: 12px;
        margin-top: 2px;
        color: #717171;
      }
      .search-box {
        padding: 12px;
      }
      /* Mesmo estilo do componente Search (components/search/search.html) */
      .nav-search {
        display: flex;
        padding: 8px;
        align-items: center;
        gap: 8px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: #000;
        color: #fff;
        cursor: text;
      }
      .nav-search svg {
        flex: none;
      }
      .nav-search input {
        flex: 1;
        min-width: 0;
        padding: 0;
        border: 0;
        background: none;
        outline: none;
        overflow: hidden;
        color: #fff;
        text-overflow: ellipsis;
        font-family: "Public Sans";
        font-size: 12px;
        font-weight: 400;
        line-height: 16px;
      }
      .nav-search input::placeholder {
        color: #717171;
      }
      .nav-search input::-webkit-search-cancel-button {
        display: none;
      }
      .filters {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 0px 20px;
      }
      .filter[hidden] {
        display: none;
      }
      .filter {
        display: flex;
        min-height: 32px;
        align-items: center;
        gap: 12px;
        cursor: pointer;
      }
      /* Mesmo estilo do componente Checkboxes (components/checkboxes/uncheck.html) */
      .filter input {
        display: flex;
        width: 16px;
        height: 16px;
        flex: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        margin: 0;

        appearance: none;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.04);
        background: #262626;
        cursor: pointer;
      }
      .filter input:checked {
        background: #5fddd3
          url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2712%27 height=%2712%27 viewBox=%270 0 12 12%27 fill=%27none%27%3E%3Cpath d=%27M10 3L4.5 8.5L2 6%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27 stroke=%27%230A181C%27/%3E%3C/svg%3E")
          no-repeat center;
      }
      .filter input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      /* Quando só parte dos itens está marcada, mostra o traço do Minus */
      .filter input:indeterminate {
        background: #5fddd3
          url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2712%27 height=%2712%27 viewBox=%270 0 12 12%27 fill=%27none%27%3E%3Cpath d=%27M2.5 6H9.5%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27 stroke=%27%230A181C%27/%3E%3C/svg%3E")
          no-repeat center;
      }

      /* Centro */
      main {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: center;
        padding: 24px 26px;
      }
      .toolbar h1 {
        font-size: 13px;
        font-weight: 400;
        margin: 0 auto 0 0;
      }
      /* Reserva a altura do Segmented, que só entra depois de carregar */
      #theme {
        min-height: 30px;
      }
      .stage {
        display: flex;
        flex: 1;
        min-height: 0;
        padding: 0 26px 26px;
        align-items: flex-start;
        overflow: auto;
      }
      /* Simulador: uma única div com todos os componentes */
      .frame {
        display: flex;
        width: 100%;
        justify-content: center;
        align-items: center;

        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.03);

        overflow: hidden;
      }
      .frame[data-theme="dark"] {
        --cell-line: rgba(255, 255, 255, 0.08);
        --cell-hover: rgba(255, 255, 255, 0.04);
        color: #fff;
      }
      .frame[data-theme="light"] {
        --cell-line: rgba(0, 0, 0, 0.08);
        --cell-hover: rgba(0, 0, 0, 0.03);
        background: rgba(0, 0, 0, 0.03);
        color: #000;
      }
      .grid {
        display: grid;
        /* O 1px a mais esconde a última linha de cada lado: colada na borda do frame, o tracejado borra */
        width: calc(100% + 1px);
        grid-template-columns: repeat(auto-fill, minmax(256px, 1fr));
        margin: 0 -1px -1px 0;
      }
      /* Altura do modelo mais alto (Alert dialog Radio): trocar de modelo não mexe na grade */
      .cell {
        display: flex;
        min-height: 342px;
        padding: 20px 16px;
        flex-direction: column;
        gap: 16px;
        border-right: 1px dashed var(--cell-line);
        border-bottom: 1px dashed var(--cell-line);
        cursor: pointer;
        transition: background 0.2s;
      }
      .grid[hidden],
      .cell[hidden] {
        display: none;
      }
      .cell:hover {
        background: var(--cell-hover);
      }
      .tooltip {
        position: fixed;
        z-index: 30;
        padding: 4px 8px;
        transform: translate(-50%, calc(-100% - 8px));

        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: #000;

        color: #fff;
        font-size: 12px;
        line-height: 16px;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.15s;
      }
      .tooltip.show {
        opacity: 1;
      }
      .cell-head {
        display: flex;
        min-height: 32px;
        align-items: center;
        gap: 8px;
      }
      /* O select e o botão de editar só aparecem com o hover na célula. Eles seguem ocupando
         espaço, para nada pular, e também aparecem no foco do teclado e com o select aberto. */
      .cell-head .cell-select,
      .cell-head .icon-btn {
        opacity: 0;
        transition:
          opacity 0.2s,
          background 0.15s,
          border-color 0.15s;
      }
      .cell:hover .cell-head .cell-select,
      .cell:hover .cell-head .icon-btn,
      .cell-head .cell-select:has(:focus-visible),
      .cell-head .cell-select.open,
      .cell-head .icon-btn:focus-visible {
        opacity: 1;
      }
      /* Sem mouse não existe hover: os controles ficam sempre visíveis */
      @media (hover: none) {
        .cell-head .cell-select,
        .cell-head .icon-btn {
          opacity: 1;
        }
      }
      .cell-title {
        flex: 1 1 auto;
        min-width: 0;
      }

      /* Select de modelos da célula */
      .cell-select {
        position: relative;
        flex: 0 1 auto;
        min-width: 96px;
        font-size: 12px;
        line-height: 16px;
      }
      .cell-select-btn {
        display: flex;
        width: 100%;
        padding: 8px 4px 8px 8px;
        align-items: center;
        gap: 4px;

        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.02);
        cursor: pointer;
      }
      .cell-select-btn span {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-align: left;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .cell-select-btn svg {
        flex: none;
        transition: transform 0.15s;
      }
      .cell-select.open .cell-select-btn {
        background: #000;
      }
      .cell-select.open .cell-select-btn svg {
        transform: rotate(180deg);
      }
      .cell-select-menu {
        display: none;
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        z-index: 15;
        min-width: 100%;
        width: max-content;
        margin: 0;
        padding: 4px;
        list-style: none;

        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: #000;
        box-shadow: 0 4px 10px 0 rgba(0, 0, 0, 0.15);
      }
      .cell-select.open .cell-select-menu {
        display: block;
      }
      .cell-select-menu button {
        display: block;
        width: 100%;
        padding: 8px;
        border: 0;
        border-radius: 6px;
        background: none;
        font-size: inherit;
        line-height: inherit;
        text-align: left;
        cursor: pointer;
      }
      .cell-select-menu button:hover,
      .cell-select-menu button:focus-visible,
      .cell-select-menu button[aria-current="true"] {
        background: rgba(255, 255, 255, 0.08);
        outline: none;
      }
      body[data-theme="light"] .cell-select-btn {
        border-color: rgba(0, 0, 0, 0.15);
        background: rgba(0, 0, 0, 0.02);
      }
      body[data-theme="light"] .cell-select.open .cell-select-btn {
        background: #fff;
      }
      body[data-theme="light"] .cell-select-menu {
        border-color: rgba(0, 0, 0, 0.15);
        background: #fff;
      }
      body[data-theme="light"] .cell-select-menu button:hover,
      body[data-theme="light"] .cell-select-menu button:focus-visible,
      body[data-theme="light"] .cell-select-menu button[aria-current="true"] {
        background: rgba(0, 0, 0, 0.08);
      }
      /* No drawer, o select ocupa a largura toda */
      #variant .cell-select {
        width: 100%;
      }
      .cell-body {
        display: flex;
        flex: 1;
        min-width: 0;
        justify-content: center;
        align-items: center;
      }
      /* Mantém o tamanho do componente mesmo que ele peça para esticar */
      .cell .cell-body > * {
        align-self: center;
      }
      /* Na grade, o Radio sem label mostra um único botão */
      .cell-body .radio-group:not(:has(span)) .radio-label + .radio-label {
        display: none;
      }

      /* Botão só com ícone: mesmo estilo do botão Glass */
      .icon-btn {
        display: inline-flex;
        flex: none;
        padding: 8px;
        justify-content: center;
        align-items: center;

        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.02);

        color: #ffffff;
        cursor: pointer;
        transition:
          background 0.15s,
          border-color 0.15s;
      }
      .icon-btn:hover {
        border-color: rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.08);
      }
      .icon-btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .frame[data-theme="light"] .icon-btn {
        border-color: rgba(0, 0, 0, 0.15);
        background: rgba(0, 0, 0, 0.02);
        color: #000;
      }
      .frame[data-theme="light"] .icon-btn:hover {
        border-color: rgba(0, 0, 0, 0.3);
        background: rgba(0, 0, 0, 0.06);
      }

      /* Drawer de detalhes */
      .backdrop {
        position: fixed;
        inset: 0;
        z-index: 19;
        background: rgba(0, 0, 0, 0.25);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
      }
      .backdrop.open {
        opacity: 1;
        pointer-events: auto;
      }
      .drawer {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        z-index: 20;
        display: flex;
        width: 452px;
        max-width: 100vw;
        flex-direction: column;
        border-left: 1px solid var(--line);
        background: #000;
        transform: translateX(100%);
        transition: transform 0.2s ease;
      }
      .drawer.open {
        transform: translateX(0);
      }
      .drawer-head {
        display: flex;
        padding: 16px 20px;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--line);
      }
      .drawer-head h2 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
      }
      .drawer-body {
        flex: 1;
        min-height: 0;
        overflow: auto;
      }
      .drawer-body section {
        padding: 16px 20px;
      }
      /* Só a descrição tem a linha embaixo */
      .drawer-body section:first-child {
        border-bottom: 1px solid var(--line);
      }
      .drawer-foot {
        display: flex;
        padding: 16px 20px;
        justify-content: flex-end;
      }
      /* Mesmo estilo do botão Glow Small (components/botoes/Glow/small.html) */
      .apply {
        display: inline-flex;
        padding: 8px;
        justify-content: center;
        align-items: center;
        gap: 8px;

        border: none;
        border-radius: 8px;
        background: #5fddd3;

        color: #0a181c;
        font-family: "Public Sans";
        font-size: 12px;
        font-style: normal;
        font-weight: 400;
        line-height: 16px;
        cursor: pointer;
        transition: background 0.15s;
      }
      .apply:hover {
        background: #7fe6de;
      }
      .apply:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .preview-box {
        overflow: hidden;
        border-radius: 8px;
        border: 1px solid var(--line);
      }
      .preview-box iframe {
        display: block;
        width: 100%;
        height: 140px;
        border: 0;
      }
      .section-title {
        font-size: 13px;
        margin: 0 0 8px;
      }
      .desc {
        margin: 0;
        color: #717171;
        font-size: 13px;
        line-height: 1.25;
      }
      /* Colunas: nome, campo, toggle. Todas as linhas ficam alinhadas entre si. */
      #knobs {
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr) auto;
        gap: 16px 12px;
        align-items: center;
      }
      .knob {
        display: contents;
      }
      .knob > span {
        grid-column: 1;
      }
      .knob > input,
      .knob > select {
        grid-column: 2 / 4;
      }
      .knob.no-label > input,
      .knob.no-label > select {
        grid-column: 1 / 4;
      }
      .knob-row > input[type="text"] {
        grid-column: 2;
      }
      /* Mesmo estilo do componente Input text (components/inputs/input-text) */
      .knob input,
      .knob select {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: #000;
        outline: none;

        overflow: hidden;
        color: #fff;
        text-overflow: ellipsis;
        font-family: "Public Sans";
        font-size: 12px;
        font-style: normal;
        font-weight: 400;
        line-height: 16px;
      }
      .knob input::placeholder {
        color: #717171;
      }
      /* Mesmo estilo do componente Toggle (components/toggle/default.html) */
      .knob .switch {
        display: flex;
        grid-column: 3;
        justify-self: end;
        width: 40px;
        height: 20px;
        flex: none;
        box-sizing: border-box;
        margin: 0;
        padding: 4px;
        align-items: center;
        gap: 8px;

        appearance: none;
        border: 0;
        border-radius: 40px;
        background: #262626;
        cursor: pointer;
        transition: background 0.15s;
      }
      .knob .switch::before {
        content: "";
        width: 10px;
        height: 6px;
        transform: rotate(-180deg);
        flex-shrink: 0;

        border-radius: 4px;
        background: #fff;
        transition: transform 0.15s;
      }
      .knob .switch:checked {
        background: #5fddd3;
      }
      .knob .switch:checked::before {
        transform: translateX(22px) rotate(-180deg);
      }
      .knob .switch:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .knob .slider {
        grid-column: 2;
        height: 20px;
        padding: 0;
        overflow: visible;

        border: 0;
        background: none;
        accent-color: #5fddd3;
        cursor: pointer;
      }
      .knob .slider:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .knob-value {
        grid-column: 3;
        justify-self: end;
        font-size: 12px;
        line-height: 16px;
      }
      /* Mesmo estilo do botão Outline Small (components/botoes/Outline/small.html) */
      .add-item {
        display: inline-flex;
        grid-column: 1 / 4;
        justify-self: end;
        padding: 8px;
        justify-content: center;
        align-items: center;
        gap: 8px;

        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: none;

        color: #fff;
        font-family: "Public Sans";
        font-size: 12px;
        font-style: normal;
        font-weight: 400;
        line-height: 16px;
        cursor: pointer;
        transition:
          background 0.15s,
          border-color 0.15s;
      }
      .add-item:hover {
        border-color: rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.06);
      }
      .add-item:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .empty {
        grid-column: 1 / -1;
        color: var(--muted);
        margin: 0;
      }
      .grid-empty {
        padding: 20px;
      }
      /* Botão copiar dentro do código */
      .code-box {
        position: relative;
      }
      .copy {
        position: absolute;
        right: 12px;
        bottom: 12px;
        backdrop-filter: blur(12px);
      }
      pre {
        display: flex;
        height: 313px;
        box-sizing: border-box;
        margin: 0;
        padding: 8px;
        align-items: flex-start;
        gap: 8px;
        align-self: stretch;

        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.02);

        color: #717171;
        font-family: inherit;
        font-size: 12px;
        line-height: 1.25;
        white-space: pre-wrap;
        word-break: break-word;
        overflow: auto;
      }
      /* Scrollbar fina e arredondada, sem trilho, afastada das bordas */
      pre::-webkit-scrollbar,
      .drawer-body::-webkit-scrollbar,
      .stage::-webkit-scrollbar {
        width: 14px;
        height: 14px;
      }
      pre::-webkit-scrollbar-track,
      .drawer-body::-webkit-scrollbar-track,
      .stage::-webkit-scrollbar-track {
        background: transparent;
        margin: 8px 0;
      }
      pre::-webkit-scrollbar-thumb,
      .drawer-body::-webkit-scrollbar-thumb,
      .stage::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.6);
        background-clip: padding-box;
        border: 4px solid transparent;
        border-radius: 999px;
      }
      pre::-webkit-scrollbar-thumb:hover,
      .drawer-body::-webkit-scrollbar-thumb:hover,
      .stage::-webkit-scrollbar-thumb:hover {
        background-color: rgba(255, 255, 255, 0.8);
      }
      /* Firefox não aceita os estilos acima; usa a versão fina na mesma cor */
      @supports (-moz-appearance: none) {
        pre,
        .drawer-body,
        .stage {
          scrollbar-width: thin;
          scrollbar-color: rgba(255, 255, 255, 0.6) transparent;
        }
      }

      .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        z-index: 30;
        transform: translate(-50%, 20px);
        background: var(--accent);
        color: var(--on-accent);
        padding: 10px 16px;
        border-radius: 8px;
        opacity: 0;
        pointer-events: none;
        transition: 0.2s;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      /* Em telas grandes a grade fica sempre em 5 colunas */
      @media (min-width: 1600px) {
        .grid {
          grid-template-columns: repeat(5, minmax(0, 1fr));
        }
      }
      @media (max-width: 1100px) {
        body {
          grid-template-columns: 220px 1fr;
        }
      }
    </style>
  </head>

            <path

                width="16"

    <div class="toast" id="toast">HTML copiado!</div>
    <div class="tooltip" id="tooltip" role="status">HTML copiado</div>

    <script>
      const $ = (id) => document.getElementById(id);
      const state = {
        list: [],
        current: null, // componente aberto no drawer
        cell: null, // célula da grade que abriu o drawer
        opener: null, // botão que abriu o drawer
        raw: "",
        values: {}, // edição em andamento no drawer
        drafts: {}, // edições dos outros modelos enquanto o drawer está aberto
        applied: {}, // valores mostrados na grade, por componente
        variant: {}, // modelo escolhido no select de cada célula
        filters: new Set(), // células marcadas na lateral
        theme: "dark",
      };
      const cache = {};

      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );

      // {{#nome}}...{{/nome}} só aparece com o toggle ligado; {{^nome}}...{{/nome}}, só desligado.
      // {{@nome}}...{{/nome}} em linhas próprias repete o trecho para cada item da lista.
      function render(raw, values) {
        const CUT = "\u0000";
        const section =
          /\{\{([#^])\s*(\w+)\s*\}\}([\s\S]*?)\{\{\/\s*\2\s*\}\}/g;
        const list =
          /^([ \t]*)\{\{@\s*(\w+)\s*\}\}([\s\S]*?)\{\{\/\s*\2\s*\}\}/gm;
        let out = raw.replace(list, (_, indent, k, inner) => {
          const items = (values[k] || []).map((item) =>
            render(inner, { ...values, ...item }),
          );
          return items.length ? indent + items.join(`\n${indent}`) : CUT;
        });
        for (let prev; prev !== out; ) {
          prev = out;
          out = out.replace(section, (_, type, k, inner) =>
            !!values[k] === (type === "#") ? inner : CUT,
          );
        }
        return out
          .replace(
            new RegExp(`^[ \\t${CUT}]*${CUT}[ \\t${CUT}]*\\r?\\n`, "gm"),
            "",
          )
          .replaceAll(CUT, "")
          .replace(/\{\{\s*(\w+)\s*\}\}/g, (_, k) => esc(values[k] ?? ""))
          .trim();
      }

      // O HTML copiado é colado fora do site: as imagens precisam do endereço completo.
      const absoluteSrc = (html) =>
        html.replace(
          /src="(components\/[^"]+)"/g,
          (_, path) => `src="${new URL(path, location.href)}"`,
        );

      function copyText() {
        return absoluteSrc(render(state.raw, state.values));
      }

      const PREVIEW_BG = {
        dark: "rgba(255, 255, 255, 0.03)",
        light: "rgba(0, 0, 0, 0.03)",
      };

      // A prévia fica em um iframe: assim os scripts e os estilos do componente
      // não se misturam com os da grade, que mostra o mesmo componente.
      function previewDoc() {
        return `<!doctype html><html data-theme="${state.theme}"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html{height:100%;overflow:hidden;background:${PREVIEW_BG[state.theme]};}
body{display:flex;height:100%;margin:0;padding:16px;overflow:auto;box-sizing:border-box;}
#component{display:flex;width:100%;margin:auto;justify-content:center;align-items:center;}
::-webkit-scrollbar{width:14px;height:14px;}
::-webkit-scrollbar-track{background:transparent;margin:8px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.6);background-clip:padding-box;border:4px solid transparent;border-radius:999px;}
[data-theme="light"] ::-webkit-scrollbar-thumb{background-color:rgba(0,0,0,.3);}
</style></head><body><div id="component">${copyText()}</div></body></html>`;
      }

      // A prévia acompanha a altura do componente, até o limite de 420px. Um menu que abre
      // dentro dela conta na altura, e o componente sobe para o menu caber embaixo dele.
      function fitContent(frame, content) {
        content.style.marginTop = "";
        const open = content.scrollHeight > content.offsetHeight;
        content.style.marginTop = open ? "0" : "";
        frame.style.height = `${Math.min(Math.max(content.scrollHeight + 32, 140), 420)}px`;
      }

      function fitPreview() {
        const frame = $("preview");
        const content = frame.contentDocument?.getElementById("component");
        if (content) {
          fitContent(frame, content);
          new frame.contentWindow.MutationObserver(() =>
            fitContent(frame, content),
          ).observe(content, {
            attributes: true,
            attributeFilter: ["class"],
            subtree: true,
          });
          // O menu animado só muda de tamanho de vez quando a animação termina.
          content.addEventListener("transitionend", () =>
            fitContent(frame, content),
          );
        }
        // Com o foco dentro da prévia, o Esc não chega à página.
        frame.contentDocument?.addEventListener("keydown", (e) => {
          if (e.key === "Escape") closeDrawer();
        });
        // Clique dentro do iframe não chega à página, que fecharia o select.
        frame.contentDocument?.addEventListener("click", () =>
          closeCellSelects(),
        );
      }

      let previewTimer;
      function update() {
        $("code").textContent = copyText();
        clearTimeout(previewTimer);
        previewTimer = setTimeout(() => {
          $("preview").srcdoc = previewDoc();
        }, 120);
      }

      // Ignora acentos e maiúsculas: "botoes" encontra "Botões".
      const plain = (s) =>
        s.normalize("NFD").replace(/\p{M}/gu, "").toLowerCase();

      // Filtra só a lista da lateral: a seleção e a grade não mudam.
      function searchFilters() {
        const q = plain($("search").value.trim());
        let found = 0;
        document
          .querySelectorAll(".filter:not(#filter-all-row)")
          .forEach((row) => {
            row.hidden = !plain(row.textContent).includes(q);
            if (!row.hidden) found++;
          });
        $("filter-all-row").hidden = !!q;
        $("filters-empty").hidden = found > 0;
      }

      // Componentes em ordem alfabética (ignora acentos e maiúsculas).
      const byName = (a, b) =>
        a.localeCompare(b, "pt-BR", { sensitivity: "base", numeric: true });

      const EDIT_ICON =
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/></svg>';

      const PLUS_ICON =
        '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3.33334 8H12.6667" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor"/><path d="M8 3.33333V12.6667" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor"/></svg>';

      const ARROW_ICON =
        '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 6L8 10L12 6" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor"/></svg>';

      // Cada entrada com "grid" no components.json vira uma célula da grade.
      const cells = () =>
        state.list
          .filter((c) => c.grid)
          .sort((a, b) => byName(a.grid.title, b.grid.title));

      const byId = (id) => state.list.find((x) => x.id === id);

      // Modelos do select da célula, vindos de "grid.options" no components.json.
      const optionsOf = (c) =>
        [...(c.grid.options || [])].sort((a, b) => byName(a.label, b.label));

      function cellSelect(c, shown) {
        const options = optionsOf(c);
        if (!options.length) return "";
        const items = options
          .map(
            (o) =>
              `<li><button type="button" data-variant="${esc(o.id)}" aria-current="${o.id === shown.id}">${esc(o.label)}</button></li>`,
          )
          .join("");
        const current = options.find((o) => o.id === shown.id);
        return `<div class="cell-select"><button class="cell-select-btn" type="button" aria-expanded="false" aria-label="Modelo de ${esc(c.grid.title)}"><span>${esc(current.label)}</span>${ARROW_ICON}</button><ul class="cell-select-menu">${items}</ul></div>`;
      }

      function setCellSelect(box, open) {
        box.classList.toggle("open", open);
        box
          .querySelector(".cell-select-btn")
          .setAttribute("aria-expanded", open);
      }

      function bindCellSelect(box, pick) {
        box.querySelector(".cell-select-btn").onclick = () =>
          setCellSelect(box, !box.classList.contains("open"));
        box.querySelectorAll("[data-variant]").forEach((b) => {
          b.onclick = () => pick(b.dataset.variant);
        });
      }

      function closeCellSelects(except) {
        document.querySelectorAll(".cell-select.open").forEach((box) => {
          if (box !== except) setCellSelect(box, false);
        });
      }

      const CELL_CONTROLS =
        "button, input, select, textarea, label, a, .cell-select, .menu";

      function renderGrid() {
        const grid = $("grid");
        grid.innerHTML = "";
        cells().forEach((c) => {
          const shown = byId(state.variant[c.id] ?? c.id);
          const cell = document.createElement("article");
          cell.className = "cell";
          cell.dataset.cell = c.id;
          cell.innerHTML = `<header class="cell-head"><span class="cell-title">${esc(c.grid.title)}</span>${cellSelect(c, shown)}<button class="icon-btn" type="button" data-edit="${esc(shown.id)}" aria-label="Editar ${esc(c.grid.title)}" title="Editar">${EDIT_ICON}</button></header><div class="cell-body">${render(cache[shown.file], state.applied[shown.id])}</div>`;
          cell.querySelector("[data-edit]").onclick = (e) =>
            openDrawer(c, shown, e.currentTarget);
          cell.onclick = (e) => {
            // Controles do componente e do cabeçalho seguem funcionando sem copiar.
            if (
              e.target.closest(CELL_CONTROLS) ||
              document.querySelector(".cell .open")
            )
              return;
            copyCell(shown, e);
          };
          const box = cell.querySelector(".cell-select");
          if (box) {
            bindCellSelect(box, (id) => {
              state.variant[c.id] = id;
              renderGrid();
              document
                .querySelector(`[data-edit="${id}"]`)
                .closest(".cell")
                .querySelector(".cell-select-btn")
                .focus();
            });
          }
          grid.appendChild(cell);
          // Script inserido por innerHTML não roda: recria para o componente funcionar.
          cell.querySelectorAll("script").forEach((old) => {
            const s = document.createElement("script");
            s.textContent = old.textContent;
            old.replaceWith(s);
          });
        });
        applyFilters();
      }

      function renderFilters() {
        const rows = cells()
          .map(
            (c) =>
              `<label class="filter"><input type="checkbox" data-filter="${esc(c.id)}" checked />${esc(c.grid.title)}</label>`,
          )
          .join("");
        $("filters").innerHTML =
          `<label class="filter" id="filter-all-row"><input type="checkbox" id="filter-all" /><span id="filter-all-label"></span></label>${rows}<p class="empty" id="filters-empty" hidden>Nada encontrado.</p>`;
        const boxes = document.querySelectorAll("[data-filter]");
        boxes.forEach((box) => {
          box.onchange = () => {
            state.filters[box.checked ? "add" : "delete"](box.dataset.filter);
            applyFilters();
          };
        });
        $("filter-all").onchange = () => {
          const selectAll = state.filters.size < boxes.length;
          state.filters = new Set(selectAll ? cells().map((c) => c.id) : []);
          boxes.forEach((box) => (box.checked = selectAll));
          applyFilters();
        };
      }

      function applyFilters() {
        const { filters } = state;
        const allOn = filters.size === cells().length;
        $("filter-all").checked = allOn;
        $("filter-all").indeterminate = filters.size > 0 && !allOn;
        $("filter-all-label").textContent = allOn
          ? "Desmarcar todos"
          : "Selecionar todos";
        document.querySelectorAll(".cell").forEach((cell) => {
          cell.hidden = !filters.has(cell.dataset.cell);
        });
        $("grid").hidden = !filters.size;
        $("grid-empty").hidden = filters.size > 0;
      }

      function makeSwitch(k, store = state.values) {
        const sw = document.createElement("input");
        sw.type = "checkbox";
        sw.className = "switch";
        sw.checked = !!store[k.name];
        sw.setAttribute("aria-label", k.label || k.name);
        sw.onchange = () => {
          store[k.name] = sw.checked;
          if (state.current.knobs.some((x) => x.when === k.name)) renderKnobs();
          update();
        };
        return sw;
      }

      function makeField(k, store = state.values) {
        let field;
        if (k.type === "select") {
          field = document.createElement("select");
          k.options.forEach((o) => field.add(new Option(o, o)));
        } else {
          field = document.createElement("input");
          field.type = "text";
        }
        field.setAttribute("aria-label", k.label || k.name);
        field.value = store[k.name];
        field.oninput = () => {
          store[k.name] = field.value;
          update();
        };
        return field;
      }

      // Knob "range": slider com o valor ao lado. "liveVar" é a variável CSS do componente,
      // aplicada direto na prévia para acompanhar o arraste sem esperar o iframe recarregar.
      function makeRange(k) {
        const range = document.createElement("input");
        range.type = "range";
        range.className = "slider";
        range.min = k.min;
        range.max = k.max;
        range.step = k.step ?? 1;
        range.value = state.values[k.name];
        range.setAttribute("aria-label", k.label || k.name);
        const value = document.createElement("output");
        value.className = "knob-value";
        value.textContent = `${range.value}${k.unit ?? ""}`;
        range.oninput = () => {
          state.values[k.name] = range.value;
          value.textContent = `${range.value}${k.unit ?? ""}`;
          if (k.liveVar) {
            $("preview")
              .contentDocument?.querySelector(`[style*="${k.liveVar}"]`)
              ?.style.setProperty(k.liveVar, value.textContent);
          }
          update();
        };
        return [range, value];
      }

      // Knob "list": uma linha de toggle e texto por item, e o botão que cria mais um.
      function renderList(k, box) {
        const items = state.values[k.name];
        items.forEach((item) => {
          const title = k.itemLabel.replace("{n}", item.n);
          const wrap = document.createElement("label");
          wrap.className = "knob knob-row";
          wrap.innerHTML = `<span>${esc(title)}</span>`;
          wrap.append(
            makeField({ name: "text", label: `Texto: ${title}` }, item),
            makeSwitch({ name: "show", label: title }, item),
          );
          box.appendChild(wrap);
        });
        const add = document.createElement("button");
        add.type = "button";
        add.className = "add-item";
        add.innerHTML = `${PLUS_ICON}${esc(k.label)}`;
        add.onclick = () => {
          const n = k.start + items.length;
          items.push({ n, show: false, text: k.itemText.replace("{n}", n) });
          renderKnobs();
          update();
          box.querySelector(".add-item").focus();
        };
        box.appendChild(add);
      }

      function renderKnobs() {
        const box = $("knobs");
        box.innerHTML = "";
        // "when" esconde o knob enquanto o toggle indicado estiver desligado.
        const knobs = (state.current.knobs || []).filter(
          (k) => !k.when || state.values[k.when],
        );
        if (!knobs.length) {
          box.innerHTML = '<p class="empty">Este componente não tem knobs.</p>';
          return;
        }
        knobs.forEach((k, i) => {
          if (k.type === "list") return renderList(k, box);
          const title = `<span>${esc(k.label || k.name)}</span>`;
          // "hideLabel" logo depois de um toggle vai para a mesma linha dele.
          if (k.hideLabel && knobs[i - 1]?.type === "toggle") return;
          const wrap = document.createElement("label");
          if (k.type === "range") {
            wrap.className = "knob knob-row";
            wrap.innerHTML = title;
            wrap.append(...makeRange(k));
          } else if (k.type === "toggle" && knobs[i + 1]?.hideLabel) {
            wrap.className = "knob knob-row";
            wrap.innerHTML = title;
            wrap.append(makeField(knobs[i + 1]), makeSwitch(k));
          } else if (k.type === "toggle") {
            wrap.className = "knob";
            wrap.innerHTML = title;
            wrap.append(makeSwitch(k));
          } else if (k.hideLabel) {
            wrap.className = "knob no-label";
            wrap.append(makeField(k));
          } else {
            wrap.className = "knob";
            wrap.innerHTML = title;
            wrap.append(makeField(k));
          }
          box.appendChild(wrap);
        });
      }

      // Select de modelos do drawer: troca o componente sem fechar e guarda a edição do anterior.
      function renderVariants() {
        const box = $("variant");
        box.innerHTML = cellSelect(state.cell, state.current);
        $("variant-section").hidden = !box.innerHTML;
        if (!box.innerHTML) return;
        bindCellSelect(box.querySelector(".cell-select"), (id) => {
          state.drafts[state.current.id] = state.values;
          showInDrawer(byId(id));
          box.querySelector(".cell-select-btn").focus();
        });
      }

      function showInDrawer(c) {
        state.current = c;
        state.raw = cache[c.file];
        state.values =
          state.drafts[c.id] ?? structuredClone(state.applied[c.id]);
        $("desc").textContent = c.description || "";
        renderVariants();
        renderKnobs();
        update();
        clearTimeout(previewTimer);
        $("preview").srcdoc = previewDoc();
        $("code").scrollTop = 0;
      }

      function openDrawer(cell, c, opener) {
        state.cell = cell;
        state.opener = opener;
        state.drafts = {};
        showInDrawer(c);
        $("drawer").inert = false;
        $("drawer").classList.add("open");
        $("backdrop").classList.add("open");
        $("close").focus();
      }

      function closeDrawer() {
        $("drawer").inert = true;
        $("drawer").classList.remove("open");
        $("backdrop").classList.remove("open");
        state.opener?.focus();
      }

      // As edições só chegam à grade ao aplicar; fechar descarta.
      // A célula passa a mostrar o modelo que estava aberto no drawer.
      function applyDrawer() {
        const { id } = state.current;
        state.applied[id] = { ...state.values };
        state.variant[state.cell.id] = id;
        renderGrid();
        state.opener = document.querySelector(`[data-edit="${id}"]`);
        closeDrawer();
      }

      async function writeClipboard(text) {
        try {
          await navigator.clipboard.writeText(text);
        } catch {
          const t = document.createElement("textarea");
          t.value = text;
          document.body.appendChild(t);
          t.select();
          document.execCommand("copy");
          t.remove();
        }
      }

      let tooltipTimer;
      async function copyCell(c, e) {
        await writeClipboard(
          absoluteSrc(render(cache[c.file], state.applied[c.id])),
        );
        const tip = $("tooltip");
        tip.style.left = `${e.clientX}px`;
        tip.style.top = `${e.clientY}px`;
        tip.classList.add("show");
        clearTimeout(tooltipTimer);
        tooltipTimer = setTimeout(() => tip.classList.remove("show"), 1200);
      }

      async function copy() {
        await writeClipboard(copyText());
        $("toast").classList.add("show");
        setTimeout(() => $("toast").classList.remove("show"), 1600);
      }

      async function init() {
        try {
          state.list = await fetch("components.json").then((r) => r.json());
          const load = async (c, values) => {
            cache[c.file] = await fetch(c.file).then((r) => r.text());
            const defaults = (c.knobs || []).map((k) => [
              k.name,
              k.default ?? "",
            ]);
            state.applied[c.id] = {
              ...Object.fromEntries(defaults),
              ...values,
            };
          };
          await Promise.all(
            cells().flatMap((c) => [
              load(c, c.grid.values),
              ...optionsOf(c)
                .filter((o) => o.id !== c.id)
                .map((o) =>
                  load(byId(o.id), { ...c.grid.values, ...o.values }),
                ),
            ]),
          );
        } catch (err) {
          $("grid").innerHTML =
            '<p class="empty" style="padding:20px">Não foi possível carregar os componentes. Abra pelo GitHub Pages ou por um servidor local (o navegador bloqueia o carregamento abrindo o arquivo direto).</p>';
          return;
        }
        // O seletor de tema é o componente Segmented, com "name" próprio para não
        // agrupar seus radios com os do mesmo componente na grade.
        const segmented = byId("toggle-segmented");
        $("theme").innerHTML = render(cache[segmented.file], {
          ...state.applied[segmented.id],
          name: "theme",
        });
        $("theme").addEventListener("change", (e) => {
          state.theme = e.target.value;
          $("frame").dataset.theme = state.theme;
          document.body.dataset.theme = state.theme;
        });
        $("copy").onclick = copy;
        $("search").oninput = searchFilters;
        $("preview").onload = fitPreview;
        $("close").onclick = closeDrawer;
        $("backdrop").onclick = closeDrawer;
        $("apply").onclick = applyDrawer;
        document.addEventListener("keydown", (e) => {
          if (e.key !== "Escape") return;
          // Com um select aberto, o Esc fecha só ele.
          if (document.querySelector(".cell-select.open"))
            return closeCellSelects();
          if ($("drawer").classList.contains("open")) closeDrawer();
        });
        document.addEventListener("click", (e) =>
          closeCellSelects(e.target.closest(".cell-select")),
        );
        state.filters = new Set(cells().map((c) => c.id));
        renderFilters();
        renderGrid();
      }
      init();
    </script>
  </body>
</html>
