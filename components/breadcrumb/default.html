<style>
  .breadcrumb-default ol {
    display: flex;
    flex-wrap: wrap;
    margin: 0;
    padding: 0;
    align-items: center;
    gap: 8px;
    list-style: none;

    font-family: "Public Sans";
    font-size: 12px;
    font-style: normal;
    font-weight: 400;
    line-height: 16px;
  }
  .breadcrumb-default li {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  /* Links anteriores */
  .breadcrumb-default a {
    display: flex;
    align-items: center;
    gap: 8px;

    border-radius: 4px;
    color: #717171;
    text-decoration: none;
    transition: color 0.15s;
  }
  .breadcrumb-default a:hover {
    color: #fff;
  }
  .breadcrumb-default a:focus-visible {
    outline: 2px solid #5fddd3;
    outline-offset: 2px;
  }
  /* Página atual */
  .breadcrumb-default .current {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #fff;
  }
  /* Ícone de origem (sempre no primeiro item) e separador em #717171 */
  .breadcrumb-default .icon,
  .breadcrumb-default .separator {
    flex: none;
    color: #717171;
  }

  /* Light mode */
  [data-theme="light"] .breadcrumb-default a:hover,
  [data-theme="light"] .breadcrumb-default .current {
    color: #0a0a0a;
  }
</style>
<nav class="breadcrumb-default" aria-label="Breadcrumb">
  <ol>
    {{@links}}
    {{#show}}
    <li>
      <a href="#">
        {{#first}}
        <svg class="icon" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M10 14V8.66667C10 8.48986 9.92976 8.32029 9.80474 8.19526C9.67971 8.07024 9.51014 8 9.33333 8H6.66667C6.48986 8 6.32029 8.07024 6.19526 8.19526C6.07024 8.32029 6 8.48986 6 8.66667V14" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor" />
          <path d="M2 6.66666C1.99995 6.47271 2.04222 6.28108 2.12386 6.10514C2.20549 5.9292 2.32453 5.77319 2.47267 5.64799L7.13933 1.64799C7.37999 1.4446 7.6849 1.33301 8 1.33301C8.3151 1.33301 8.62001 1.4446 8.86067 1.64799L13.5273 5.64799C13.6755 5.77319 13.7945 5.9292 13.8761 6.10514C13.9578 6.28108 14 6.47271 14 6.66666V12.6667C14 13.0203 13.8595 13.3594 13.6095 13.6095C13.3594 13.8595 13.0203 14 12.6667 14H3.33333C2.97971 14 2.64057 13.8595 2.39052 13.6095C2.14048 13.3594 2 13.0203 2 12.6667V6.66666Z" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor" />
        </svg>
        {{/first}}
        {{text}}
      </a>
      <svg class="separator" width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M4.5 9L7.5 6L4.5 3" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor" />
      </svg>
    </li>
    {{/show}}
    {{/links}}
    <li>
      <span class="current" aria-current="page">
        {{^linksAny}}
        <svg class="icon" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M10 14V8.66667C10 8.48986 9.92976 8.32029 9.80474 8.19526C9.67971 8.07024 9.51014 8 9.33333 8H6.66667C6.48986 8 6.32029 8.07024 6.19526 8.19526C6.07024 8.32029 6 8.48986 6 8.66667V14" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor" />
          <path d="M2 6.66666C1.99995 6.47271 2.04222 6.28108 2.12386 6.10514C2.20549 5.9292 2.32453 5.77319 2.47267 5.64799L7.13933 1.64799C7.37999 1.4446 7.6849 1.33301 8 1.33301C8.3151 1.33301 8.62001 1.4446 8.86067 1.64799L13.5273 5.64799C13.6755 5.77319 13.7945 5.9292 13.8761 6.10514C13.9578 6.28108 14 6.47271 14 6.66666V12.6667C14 13.0203 13.8595 13.3594 13.6095 13.6095C13.3594 13.8595 13.0203 14 12.6667 14H3.33333C2.97971 14 2.64057 13.8595 2.39052 13.6095C2.14048 13.3594 2 13.0203 2 12.6667V6.66666Z" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor" />
        </svg>
        {{/linksAny}}
        {{current}}
      </span>
    </li>
  </ol>
</nav>
