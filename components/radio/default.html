<style>
  .radio-group {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  /* Com label, os radios ficam um embaixo do outro */
  .radio-group:has(span) {
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
  }
  .radio-label {
    display: inline-flex;
    align-items: center;
    gap: 8px;

    color: #fff;
    font-family: "Public Sans";
    font-size: 12px;
    font-style: normal;
    font-weight: 400;
    line-height: 16px;
    cursor: pointer;
  }
  .radio {
    display: flex;
    width: 16px;
    height: 16px;
    flex: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    box-sizing: border-box;
    margin: 0;

    appearance: none;
    border-radius: 50px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: #262626;
    cursor: pointer;
  }
  .radio:checked {
    background: none;
  }
  /* Marcador no centro do radio selecionado */
  .radio::before {
    content: "";
    width: 10px;
    height: 10px;
    flex-shrink: 0;

    border-radius: 50px;
    background: #5fddd3;
    transform: scale(0);
    transition: transform 0.15s;
  }
  .radio:checked::before {
    transform: scale(1);
  }
  .radio:focus-visible {
    outline: 2px solid #5fddd3;
    outline-offset: 2px;
  }

  /* Light mode */
  [data-theme="light"] .radio-label {
    color: #000;
  }
  [data-theme="light"] .radio {
    border: 1px solid rgba(0, 0, 0, 0.15);
    background: #e5e5e5;
  }
  [data-theme="light"] .radio:checked {
    background: none;
  }
</style>
<div class="radio-group">
  <label class="radio-label">
    <input class="radio" type="radio" name="radio-default"{{^showLabel1}} aria-label="{{label1}}"{{/showLabel1}} />
    {{#showLabel1}}<span>{{label1}}</span>{{/showLabel1}}
  </label>
  <label class="radio-label">
    <input class="radio" type="radio" name="radio-default" checked{{^showLabel2}} aria-label="{{label2}}"{{/showLabel2}} />
    {{#showLabel2}}<span>{{label2}}</span>{{/showLabel2}}
  </label>
</div>
