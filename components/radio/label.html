<style>
  .radio-label-group {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
  }
  .radio-label {
    display: inline-flex;
    align-items: center;
    gap: 8px;

    color: #fff;
    font-family: "Public Sans";
    font-size: 12px;
    font-style: normal;
    font-weight: 400;
    line-height: 16px;
    cursor: pointer;
  }
  .radio-label input {
    display: flex;
    width: 16px;
    height: 16px;
    flex: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    box-sizing: border-box;
    margin: 0;

    appearance: none;
    border-radius: 50px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: #262626;
    cursor: pointer;
  }
  .radio-label input:checked {
    background: none;
  }
  /* Marcador no centro do radio selecionado */
  .radio-label input::before {
    content: "";
    width: 10px;
    height: 10px;
    flex-shrink: 0;

    border-radius: 50px;
    background: #5fddd3;
    transform: scale(0);
    transition: transform 0.15s;
  }
  .radio-label input:checked::before {
    transform: scale(1);
  }
  .radio-label input:focus-visible {
    outline: 2px solid #5fddd3;
    outline-offset: 2px;
  }

  /* Light mode */
  [data-theme="light"] .radio-label {
    color: #000;
  }
  [data-theme="light"] .radio-label input {
    border: 1px solid rgba(0, 0, 0, 0.15);
    background: #e5e5e5;
  }
  [data-theme="light"] .radio-label input:checked {
    background: none;
  }
</style>
<div class="radio-label-group">
  <label class="radio-label">
    <input type="radio" name="radio-label" />
    {{label1}}
  </label>
  <label class="radio-label">
    <input type="radio" name="radio-label" checked />
    {{label2}}
  </label>
</div>
