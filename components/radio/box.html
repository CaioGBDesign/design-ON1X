<style>
  .radio-box-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 414px;
    max-width: 100%;
  }

  /* Desmarcado */
  .radio-box {
    display: flex;
    width: 414px;
    max-width: 100%;
    box-sizing: border-box;
    padding: 20px;
    flex-direction: column;
    align-items: flex-start;
    gap: 16px;

    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.04);
    background: rgba(255, 255, 255, 0.02);

    font-family: "Public Sans";
    font-style: normal;
    font-weight: 400;
    cursor: pointer;
    transition: background 0.15s;
  }
  /* Marcado */
  .radio-box:has(input:checked) {
    background: rgba(43, 100, 96, 0.15);
  }
  .radio-box .head {
    display: flex;
    align-items: center;
    gap: 8px;
    align-self: stretch;
  }
  .radio-box .title {
    display: flex;
    height: 16px;
    flex-direction: column;
    justify-content: center;
    flex: 1 0 0;

    color: #fff;
    font-size: 14px;
    line-height: 20px; /* 142.857% */
  }
  .radio-box .description {
    align-self: stretch;

    color: #717171;
    font-size: 12px;
    line-height: normal;
  }

  /* Radio */
  .radio-box input {
    display: flex;
    width: 16px;
    height: 16px;
    flex: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    box-sizing: border-box;
    margin: 0;

    appearance: none;
    border-radius: 50px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: #262626;
    cursor: pointer;
  }
  .radio-box input:checked {
    background: none;
  }
  /* Marcador no centro do radio selecionado */
  .radio-box input::before {
    content: "";
    width: 10px;
    height: 10px;
    flex-shrink: 0;

    border-radius: 50px;
    background: #5fddd3;
    transform: scale(0);
    transition: transform 0.15s;
  }
  .radio-box input:checked::before {
    transform: scale(1);
  }
  .radio-box input:focus-visible {
    outline: 2px solid #5fddd3;
    outline-offset: 2px;
  }

  /* Light mode */
  [data-theme="light"] .radio-box {
    border: 1px solid rgba(0, 0, 0, 0.04);
    background: rgba(0, 0, 0, 0.02);
  }
  [data-theme="light"] .radio-box:has(input:checked) {
    background: rgba(10, 24, 28, 0.05);
  }
  [data-theme="light"] .radio-box .title {
    color: #000;
  }
  [data-theme="light"] .radio-box input {
    border: 1px solid rgba(0, 0, 0, 0.15);
    background: #e5e5e5;
  }
  [data-theme="light"] .radio-box input:checked {
    background: none;
  }
</style>
<div class="radio-box-group">
  <label class="radio-box">
    <span class="head">
      <input type="radio" name="radio-box" />
      <span class="title">{{title1}}</span>
    </span>
    {{#showDescription1}}<span class="description">{{description1}}</span>{{/showDescription1}}
  </label>
  <label class="radio-box">
    <span class="head">
      <input type="radio" name="radio-box" checked />
      <span class="title">{{title2}}</span>
    </span>
    {{#showDescription2}}<span class="description">{{description2}}</span>{{/showDescription2}}
  </label>
</div>
