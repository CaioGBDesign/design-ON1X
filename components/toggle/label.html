<style>
  .toggle-label {
    display: inline-flex;
    align-items: center;
    gap: 8px;

    color: #fff;
    font-family: "Public Sans";
    font-size: 12px;
    font-style: normal;
    font-weight: 400;
    line-height: 16px;
    cursor: pointer;
  }
  /* Corpo desmarcado */
  .toggle-label input {
    display: flex;
    width: 40px;
    height: 20px;
    flex: none;
    box-sizing: border-box;
    margin: 0;
    padding: 4px;
    align-items: center;
    gap: 8px;

    appearance: none;
    border-radius: 40px;
    background: #262626;
    cursor: pointer;
    transition: background 0.15s;
  }
  /* Círculo indicador */
  .toggle-label input::before {
    content: "";
    width: 10px;
    height: 6px;
    transform: rotate(-180deg);
    flex-shrink: 0;

    border-radius: 4px;
    background: #fff;
    transition: transform 0.15s;
  }
  /* Corpo marcado: o indicador vai para a direita */
  .toggle-label input:checked {
    background: #5fddd3;
  }
  .toggle-label input:checked::before {
    transform: translateX(22px) rotate(-180deg);
  }
  .toggle-label input:focus-visible {
    outline: 2px solid #5fddd3;
    outline-offset: 2px;
  }

  /* Light mode */
  [data-theme="light"] .toggle-label {
    color: #000;
  }
  [data-theme="light"] .toggle-label input {
    background: #e5e5e5;
  }
  [data-theme="light"] .toggle-label input::before {
    background: #000;
  }
  [data-theme="light"] .toggle-label input:checked {
    background: #5fddd3;
  }
</style>
<label class="toggle-label">
  <input type="checkbox" role="switch"{{#checked}} checked{{/checked}} />
  {{label}}
</label>
