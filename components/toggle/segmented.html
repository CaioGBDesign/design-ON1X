<style>
  .segmented {
    display: flex;
    width: fit-content;
    padding: 4px;
    align-items: center;
    box-sizing: border-box;

    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: rgba(255, 255, 255, 0.03);
  }
  /* Opção desmarcada */
  .segmented label {
    position: relative;
    display: flex;
    padding: 2px 8px;
    align-items: center;
    gap: 4px;

    border-radius: 12px;
    color: #fff;
    font-family: "Public Sans";
    font-size: 12px;
    font-style: normal;
    font-weight: 400;
    line-height: 16px;
    white-space: nowrap;
    cursor: pointer;
  }
  .segmented label:not(:has(input:checked)):hover {
    background: rgba(255, 255, 255, 0.06);
  }
  /* Opção marcada */
  .segmented label:has(input:checked) {
    background: #5fddd3;
    color: #0a181c;
  }
  .segmented label:has(input:focus-visible) {
    outline: 2px solid #5fddd3;
    outline-offset: 2px;
  }
  /* O radio fica invisível, mas segue funcionando com clique e teclado */
  .segmented input {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: 0;
    opacity: 0;
  }
  .segmented svg {
    flex: none;
  }

  /* Light mode */
  [data-theme="light"] .segmented {
    border: 1px solid rgba(0, 0, 0, 0.15);
    background: rgba(0, 0, 0, 0.03);
  }
  [data-theme="light"] .segmented label {
    color: #000;
  }
  [data-theme="light"] .segmented label:not(:has(input:checked)):hover {
    background: rgba(0, 0, 0, 0.06);
  }
</style>
<div class="segmented" role="radiogroup" aria-label="Tema">
  <label{{^label1}} title="Modo escuro"{{/label1}}>
    <input type="radio" name="{{name}}" value="dark" checked{{^label1}} aria-label="Modo escuro"{{/label1}} />

    </svg>
    {{#label1}}{{label1Text}}{{/label1}}
  </label>
  <label{{^label2}} title="Modo claro"{{/label2}}>
    <input type="radio" name="{{name}}" value="light"{{^label2}} aria-label="Modo claro"{{/label2}} />
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M10.6667 7.99998C10.6667 9.47274 9.4728 10.6666 8.00004 10.6666C6.52728 10.6666 5.33337 9.47274 5.33337 7.99998C5.33337 6.52722 6.52728 5.33331 8.00004 5.33331C9.4728 5.33331 10.6667 6.52722 10.6667 7.99998Z" />
      <path d="M8 2.66669H8.00667" />
      <path d="M13.3334 8H13.34" />
      <path d="M8 13.3333H8.00667" />
      <path d="M2.66663 8H2.67329" />
      <path d="M11.7714 4.22864H11.778" />
      <path d="M11.7714 11.7714H11.778" />
      <path d="M4.22864 11.7714H4.2353" />
      <path d="M4.22864 4.22864H4.2353" />
    </svg>
    {{#label2}}{{label2Text}}{{/label2}}
  </label>
  {{@extraOptions}}
  <label{{^show}} title="{{text}}"{{/show}}>
    <input type="radio" name="{{name}}" value="opcao-{{n}}"{{^show}} aria-label="{{text}}"{{/show}} />
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="8" cy="8" r="5.33333" stroke-width="0.5" stroke="currentColor" />
    </svg>
    {{#show}}{{text}}{{/show}}
  </label>
  {{/extraOptions}}
</div>
