<style>
.ds-btn {
  display: inline-flex; align-items: center; gap: var(--ds-space-2);
  font: 600 var(--ds-text-md)/1 var(--ds-font);
  padding: 14px 24px; border-radius: var(--ds-radius-pill);
  border: 1.5px solid transparent; cursor: pointer;
  transition: background .15s, color .15s;
}
.ds-btn svg { width: 18px; height: 18px; }
.ds-btn--primary { background: var(--ds-primary); color: var(--ds-on-primary); }
.ds-btn--primary:hover { background: var(--ds-primary-hover); }
.ds-btn--secondary { background: transparent; color: var(--ds-primary); border-color: var(--ds-primary); }
.ds-btn--ghost { background: transparent; color: var(--ds-primary); }
</style>
<button class="ds-btn ds-btn--{{variant}}" type="button">
  {{label}}
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
</button>
