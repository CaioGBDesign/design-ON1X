<style>
  .input-text-disabled {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    width: 402px;
    max-width: 100%;
    box-sizing: border-box;

    color: #fff;
    font-family: "Public Sans";
    font-size: 12px;
    font-style: normal;
    font-weight: 400;
    line-height: 16px;
  }
  .input-text-disabled .top-right,
  .input-text-disabled .bottom-right {
    margin-left: auto;
  }
  .input-text-disabled .bottom-left,
  .input-text-disabled .bottom-right {
    order: 1;
    color: rgba(255, 255, 255, 0.4);
  }
  .input-text-disabled .field {
    display: flex;
    width: 100%;
    box-sizing: border-box;
    padding: 8px;
    align-items: center;
    gap: 8px;

    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: #000;
    cursor: not-allowed;
  }
  .input-text-disabled .icon {
    flex: none;
  }
  .input-text-disabled input {
    flex: 1;
    min-width: 0;
    padding: 0;
    border: 0;
    background: none;
    outline: none;

    overflow: hidden;
    color: #fff;
    text-overflow: ellipsis;
    font: inherit;
    cursor: not-allowed;
  }
  .input-text-disabled input::placeholder {
    color: #717171;
  }

  /* Bloqueado */
  .input-text-disabled .top-left,
  .input-text-disabled .top-right,
  .input-text-disabled .icon,
  .input-text-disabled input::placeholder {
    color: #262626;
  }

  /* Light mode */
  [data-theme="light"] .input-text-disabled {
    width: 400px;
    color: #000;
  }
  [data-theme="light"] .input-text-disabled .bottom-left,
  [data-theme="light"] .input-text-disabled .bottom-right {
    color: rgba(0, 0, 0, 0.4);
  }
  [data-theme="light"] .input-text-disabled .field {
    border: 1px solid rgba(0, 0, 0, 0.15);
    background: #fff;
  }
  [data-theme="light"] .input-text-disabled input {
    color: #000;
  }
  [data-theme="light"] .input-text-disabled .top-left,
  [data-theme="light"] .input-text-disabled .top-right,
  [data-theme="light"] .input-text-disabled .icon,
  [data-theme="light"] .input-text-disabled input::placeholder {
    color: #c4c4c4;
  }
</style>
<div class="input-text-disabled">
  {{#topLeft}}<span class="top-left">{{topLeftText}}</span>{{/topLeft}}
  {{#topRight}}<span class="top-right">{{topRightText}}</span>{{/topRight}}
  {{#bottomLeft}}<span class="bottom-left">{{bottomLeftText}}</span>{{/bottomLeft}}
  {{#bottomRight}}<span class="bottom-right">{{bottomRightText}}</span>{{/bottomRight}}
  <label class="field">
    {{#icon}}
    <svg class="icon" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M11.3334 5.33333C11.3334 7.17428 9.84097 8.66667 8.00002 8.66667C6.15907 8.66667 4.66669 7.17428 4.66669 5.33333C4.66669 3.49238 6.15907 2 8.00002 2C9.84097 2 11.3334 3.49238 11.3334 5.33333Z" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor" />
      <path d="M13.3334 14C13.3334 12.5855 12.7715 11.229 11.7713 10.2288C10.7711 9.22859 9.41451 8.66669 8.00002 8.66669C6.58553 8.66669 5.22898 9.22859 4.22878 10.2288C3.22859 11.229 2.66669 12.5855 2.66669 14" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor" />
    </svg>
    {{/icon}}
    <input type="text" placeholder="{{placeholder}}" disabled />
  </label>
</div>
