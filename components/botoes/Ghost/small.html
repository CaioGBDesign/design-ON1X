<style>
  .ghost-sm {
    display: inline-flex;
    padding: 8px;
    justify-content: center;
    align-items: center;
    gap: 8px;

    border: none;
    border-radius: 8px;
    background: transparent;

    color: #fff;
    font-family: "Public Sans";
    font-size: 12px;
    font-style: normal;
    font-weight: 400;
    line-height: 16px; /* 133.333% */
    cursor: pointer;
  }

  /* Hover */
  .ghost-sm {
    transition: background 0.15s;
  }
  .ghost-sm:hover {
    background: rgba(255, 255, 255, 0.06);
  }

  /* Light mode */
  [data-theme="light"] .ghost-sm {
    color: #000;
  }
  [data-theme="light"] .ghost-sm:hover {
    background: rgba(0, 0, 0, 0.06);
  }
</style>
<button class="ghost-sm">
  <svg
    width="16"
    height="16"
    viewBox="0 0 16 16"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
  >
    <path
      d="M3.33334 8H12.6667"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke="currentColor"
    />
    <path
      d="M8 3.33333V12.6667"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke="currentColor"
    />
  </svg>
  {{label}}
</button>
