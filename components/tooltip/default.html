<style>
  .tooltip-default {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
  }
  .tooltip-default .box {
    display: inline-flex;
    padding: 6px 12px;
    justify-content: center;
    align-items: center;
    gap: 4px;

    border-radius: 10px;
    background: #000;

    color: #fff;
    font-family: "Public Sans";
    font-size: 12px;
    font-style: normal;
    font-weight: 400;
    line-height: normal;
  }
  /* Mesmo estilo do componente Avatar (components/Avatar/single.html), em 16px */
  .tooltip-default .avatar {
    display: block;
    width: 16px;
    height: 16px;
    flex: none;

    border-radius: 50%;
    object-fit: cover;
  }
  /* O ícone acompanha a cor do texto */
  .tooltip-default .icon {
    flex: none;
  }
  .tooltip-default .text {
    display: flex;
    flex-direction: column;
  }
  .tooltip-default .description {
    color: #717171;
  }
  /* Triângulo no final do tooltip */
  .tooltip-default .arrow {
    display: block;
    flex: none;
    fill: #000;
  }

  /* Light mode */
  [data-theme="light"] .tooltip-default .box {
    background: #fff;
    color: #000;
  }
  [data-theme="light"] .tooltip-default .arrow {
    fill: #fff;
  }
</style>
<div class="tooltip-default" role="tooltip">
  <span class="box">
    {{#avatar}}<img class="avatar" src="components/Avatar/caio.jpg" alt="Caio" />{{/avatar}}
