<style>
  .dropdown-toggle {
    position: relative;
    display: inline-flex;
  }
  /* Botão que abre o dropdown: mesmo estilo do botão Ghost Small */
  .dropdown-toggle .trigger {
    display: inline-flex;
    padding: 8px;
    justify-content: center;
    align-items: center;
    gap: 8px;

    border: none;
    border-radius: 8px;
    background: transparent;

    color: #fff;
    cursor: pointer;
    transition: background 0.15s;
  }
  .dropdown-toggle .trigger:hover {
    background: rgba(255, 255, 255, 0.06);
  }
  .dropdown-toggle .menu {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    z-index: 20;
    width: 216px;
    flex-direction: column;
    align-items: flex-start;

    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: #000;
    box-shadow: var(--shadow-md-1-offset-x, 0) var(--shadow-md-1-offset-y, 1px) var(--shadow-md-1-blur-radius, 3px) var(--shadow-md-1-spread-radius, 0) var(--shadow-md-1-color, rgba(0, 0, 0, 0.01)), var(--shadow-md-2-offset-x, 0) var(--shadow-md-2-offset-y, 2px) var(--shadow-md-2-blur-radius, 4px) var(--shadow-md-2-spread-radius, -1px) var(--shadow-md-2-color, rgba(0, 0, 0, 0.01));

    /* Surge crescendo a partir do canto, e faz o caminho inverso ao fechar */
    opacity: 0;
    transform: translateY(-8px) scale(0.95);
    transform-origin: top left;
    transition: opacity 0.15s ease-out, transform 0.15s ease-out, display 0.15s allow-discrete;
  }
  .dropdown-toggle.open .menu {
    display: flex;
    opacity: 1;
    transform: none;
  }
  @starting-style {
    .dropdown-toggle.open .menu {
      opacity: 0;
      transform: translateY(-8px) scale(0.95);
    }
  }
  .dropdown-toggle .group {
    display: flex;
    padding: 4px;
    flex-direction: column;
    align-items: flex-start;
    align-self: stretch;
  }
  .dropdown-toggle .item {
    display: flex;
    padding: 8px;
    align-items: center;
    gap: 8px;
    align-self: stretch;

    border: 0;
    border-radius: 8px;
    background: none;

    color: #fff;
    cursor: pointer;
  }
  .dropdown-toggle .label {
    cursor: default;
  }
  .dropdown-toggle label.item:hover,
  .dropdown-toggle label.item:focus-within {
    background: rgba(255, 255, 255, 0.08);
    outline: none;
  }
  .dropdown-toggle .text {
    flex: 1;
    height: 16px;
    align-self: center; /* A linha é mais alta por causa do toggle */

    color: #fff;
    font-family: "Public Sans";
    font-size: 12px;
    font-style: normal;
    font-weight: 400;
    line-height: 16px;
    text-align: left;
  }
  .dropdown-toggle svg {
    flex: none;
  }
  /* Mesmo estilo do componente Toggle (components/toggle/default.html) */
  .dropdown-toggle .toggle {
    display: flex;
    width: 40px;
    height: 20px;
    flex: none;
    box-sizing: border-box;
    margin: 0;
    padding: 4px;
    align-items: center;
    gap: 8px;

    appearance: none;
    border-radius: 40px;
    background: #262626;
    cursor: pointer;
    transition: background 0.15s;
  }
  .dropdown-toggle .toggle::before {
    content: "";
    width: 10px;
    height: 6px;
    transform: rotate(-180deg);
    flex-shrink: 0;

    border-radius: 4px;
    background: #fff;
    transition: transform 0.15s;
  }
  .dropdown-toggle .toggle:checked {
    background: #5fddd3;
  }
  .dropdown-toggle .toggle:checked::before {
    transform: translateX(22px) rotate(-180deg);
  }
  .dropdown-toggle .toggle:focus-visible {
    outline: 2px solid #5fddd3;
    outline-offset: 2px;
  }

  /* Light mode */
  [data-theme="light"] .dropdown-toggle .trigger {
    color: #000;
  }
  [data-theme="light"] .dropdown-toggle .trigger:hover {
    background: rgba(0, 0, 0, 0.06);
  }
  [data-theme="light"] .dropdown-toggle .menu {
    border: 1px solid rgba(0, 0, 0, 0.15);
    background: #fff;
  }
  [data-theme="light"] .dropdown-toggle .item,
  [data-theme="light"] .dropdown-toggle .text {
    color: #000;
  }
  [data-theme="light"] .dropdown-toggle label.item:hover,
  [data-theme="light"] .dropdown-toggle label.item:focus-within {
    background: rgba(0, 0, 0, 0.08);
  }
  [data-theme="light"] .dropdown-toggle .toggle {
    background: #e5e5e5;
  }
  [data-theme="light"] .dropdown-toggle .toggle::before {
    background: #000;
  }
  [data-theme="light"] .dropdown-toggle .toggle:checked {
    background: #5fddd3;
  }
</style>

<script>
  // Abre e fecha o dropdown e mantém o menu visível quando falta espaço à direita.
  document.querySelectorAll(".dropdown-toggle").forEach((root) => {
    const trigger = root.querySelector(".trigger");
    const menu = root.querySelector(".menu");

    const keepInside = (panel) => {
      panel.style.left = "";
      // O limite é o contêiner mais próximo que corta o conteúdo, ou a tela.
      let clip = panel.parentElement;
      while (clip && getComputedStyle(clip).overflowX === "visible") clip = clip.parentElement;
      const limit = clip ? clip.getBoundingClientRect().right : document.documentElement.clientWidth;
      const over = panel.getBoundingClientRect().left + panel.offsetWidth - (limit - 16);
      if (over > 0) panel.style.left = `calc(${getComputedStyle(panel).left} - ${over}px)`;
    };
    const setOpen = (open) => {
      root.classList.toggle("open", open);
      trigger.setAttribute("aria-expanded", open);
      if (open) keepInside(menu);
    };

    trigger.addEventListener("click", () => setOpen(!root.classList.contains("open")));
    document.addEventListener("click", (e) => {
      if (!root.contains(e.target)) setOpen(false);
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") setOpen(false);
    });
  });
</script>
