<style>
  .dropdown-mini {
    position: relative;
    display: inline-flex;
  }
  /* Botão que abre o dropdown: mesmo estilo do botão Ghost Small */
  .dropdown-mini .trigger {
    display: inline-flex;
    padding: 8px;
    justify-content: center;
    align-items: center;
    gap: 8px;

    border: none;
    border-radius: 8px;
    background: transparent;

    color: #fff;
    cursor: pointer;
    transition: background 0.15s;
  }
  .dropdown-mini .trigger:hover {
    background: rgba(255, 255, 255, 0.06);
  }
  .dropdown-mini .menu {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    z-index: 20;
    width: 216px;
    flex-direction: column;
    align-items: flex-start;

    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: #000;
    box-shadow: var(--shadow-md-1-offset-x, 0) var(--shadow-md-1-offset-y, 1px) var(--shadow-md-1-blur-radius, 3px) var(--shadow-md-1-spread-radius, 0) var(--shadow-md-1-color, rgba(0, 0, 0, 0.01)), var(--shadow-md-2-offset-x, 0) var(--shadow-md-2-offset-y, 2px) var(--shadow-md-2-blur-radius, 4px) var(--shadow-md-2-spread-radius, -1px) var(--shadow-md-2-color, rgba(0, 0, 0, 0.01));

    /* Surge crescendo a partir do canto, e faz o caminho inverso ao fechar */
    opacity: 0;
    transform: translateY(-8px) scale(0.95);
    transform-origin: top left;
    transition: opacity 0.15s ease-out, transform 0.15s ease-out, display 0.15s allow-discrete;
  }
  .dropdown-mini.open .menu {
    display: flex;
    opacity: 1;
    transform: none;
  }
  @starting-style {
    .dropdown-mini.open .menu {
      opacity: 0;
      transform: translateY(-8px) scale(0.95);
    }
  }
  .dropdown-mini .group {
    display: flex;
    padding: 4px;
    flex-direction: column;
    align-items: flex-start;
    align-self: stretch;
  }
  /* A linha só aparece entre os grupos: separa a ação de deletar */
  .dropdown-mini .group + .group {
    border-top: 1px solid rgba(255, 255, 255, 0.15);
  }
  .dropdown-mini .item {
    display: flex;
    padding: 8px;
    align-items: center;
    gap: 8px;
    align-self: stretch;

    border: 0;
    border-radius: 8px;
    background: none;

    color: #fff;
    cursor: pointer;
  }
  .dropdown-mini button.item:hover,
  .dropdown-mini button.item:focus-visible {
    background: rgba(255, 255, 255, 0.08);
    outline: none;
  }
  .dropdown-mini .text {
    flex: 1;
    height: 16px;
    align-self: stretch;

    color: #fff;
    font-family: "Public Sans";
    font-size: 12px;
    font-style: normal;
    font-weight: 400;
    line-height: 16px;
    text-align: left;
  }
  .dropdown-mini svg {
    flex: none;
  }
  .dropdown-mini .danger,
  .dropdown-mini .danger .text {
    color: #c44545;
  }

  /* Light mode */
  [data-theme="light"] .dropdown-mini .trigger {
    color: #000;
  }
  [data-theme="light"] .dropdown-mini .trigger:hover {
    background: rgba(0, 0, 0, 0.06);
  }
  [data-theme="light"] .dropdown-mini .menu {
    border: 1px solid rgba(0, 0, 0, 0.15);
    background: #fff;
  }
  [data-theme="light"] .dropdown-mini .group + .group {
    border-top: 1px solid rgba(0, 0, 0, 0.15);
  }
  [data-theme="light"] .dropdown-mini .item,
  [data-theme="light"] .dropdown-mini .text {
    color: #000;
  }
  [data-theme="light"] .dropdown-mini .danger,
  [data-theme="light"] .dropdown-mini .danger .text {
    color: #a13939;
  }
  [data-theme="light"] .dropdown-mini button.item:hover,
  [data-theme="light"] .dropdown-mini button.item:focus-visible {
    background: rgba(0, 0, 0, 0.08);
  }
</style>

    </div>
    <div class="group">
      <button class="item danger" type="button">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M6.66669 7.33333V11.3333" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor" />
          <path d="M9.33331 7.33333V11.3333" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor" />

          <path d="M2 4H14" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor" />
          <path d="M5.33331 4V2.66667C5.33331 2.31305 5.47379 1.97391 5.72384 1.72386C5.97389 1.47381 6.31302 1.33333 6.66665 1.33333H9.33331C9.68693 1.33333 10.0261 1.47381 10.2761 1.72386C10.5262 1.97391 10.6666 2.31305 10.6666 2.66667V4" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor" />
        </svg>
        <span class="text">Deletar</span>
      </button>
    </div>
  </div>
</div>
<script>
  // Abre e fecha o dropdown e mantém o menu visível quando falta espaço à direita.
  document.querySelectorAll(".dropdown-mini").forEach((root) => {
    const trigger = root.querySelector(".trigger");
    const menu = root.querySelector(".menu");

    const keepInside = (panel) => {
      panel.style.left = "";
      // O limite é o contêiner mais próximo que corta o conteúdo, ou a tela.
      let clip = panel.parentElement;
      while (clip && getComputedStyle(clip).overflowX === "visible") clip = clip.parentElement;
      const limit = clip ? clip.getBoundingClientRect().right : document.documentElement.clientWidth;
      const over = panel.getBoundingClientRect().left + panel.offsetWidth - (limit - 16);
      if (over > 0) panel.style.left = `calc(${getComputedStyle(panel).left} - ${over}px)`;
    };
    const setOpen = (open) => {
      root.classList.toggle("open", open);
      trigger.setAttribute("aria-expanded", open);
      if (open) keepInside(menu);
    };

    trigger.addEventListener("click", () => setOpen(!root.classList.contains("open")));
    menu.querySelectorAll("button.item").forEach((item) => {
      item.addEventListener("click", () => setOpen(false));
    });
    document.addEventListener("click", (e) => {
      if (!root.contains(e.target)) setOpen(false);
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") setOpen(false);
    });
  });
</script>
