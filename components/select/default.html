<style>
  .select-default {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    width: 100%;
    max-width: 360px;

    color: #fff;
    font-family: "Public Sans";
    font-size: 12px;
    line-height: 16px;
  }
  .select-default .top-right,
  .select-default .bottom-right {
    margin-left: auto;
  }
  .select-default .bottom-left,
  .select-default .bottom-right {
    order: 1;
    color: rgba(255, 255, 255, 0.4);
  }
  .select-default .control {
    position: relative;
    width: 100%;
  }
  .select-default .field {
    display: flex;
    padding: 8px;
    align-items: center;
    gap: 8px;
    align-self: stretch;
    width: 100%;

    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: rgba(255, 255, 255, 0.02);

    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .select-default .value {
    flex: 1;
  }
  .select-default .icon {
    flex: none;
    color: #9ade7b;
  }
  .select-default .arrow {
    flex: none;
    transition: transform 0.15s;
  }
  /* Ao abrir, o campo fica com o visual do Active */
  .select-default.open .field {
    background: #000;
  }
  .select-default.open .arrow {
    transform: rotate(180deg);
  }

  /* Lista de opções */
  .select-default .menu {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    right: 0;
    z-index: 10;
    flex-direction: column;
    align-items: flex-start;
    align-self: stretch;

    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: #000;
    box-shadow: 0 4px 10px 0 rgba(0, 0, 0, 0.15);
  }
  .select-default.open .menu {
    display: flex;
  }
  .select-default .search,
  .select-default .options {
    align-self: stretch;
  }
  .select-default .search {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.15);
  }
  .select-default .search input {
    flex: 1;
    min-width: 0;
    padding: 0;
    border: 0;
    background: none;
    color: inherit;
    font: inherit;
    outline: none;
  }
  .select-default .search input::placeholder {
    color: #fff;
  }
  .select-default .options {
    margin: 0;
    padding: 4px;
    list-style: none;
  }
  .select-default .options button {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 8px;
    border: 0;
    border-radius: 6px;
    background: none;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .select-default .options button:hover,
  .select-default .options button:focus-visible {
    background: rgba(255, 255, 255, 0.08);
    outline: none;
  }

  /* Sem texto: o campo encolhe para o ícone e a seta */
  .select-default.compact {
    width: auto;
  }
  .select-default.compact .menu {
    right: auto;
    min-width: 240px;
  }
</style>
<div class="select-default{{^showText}} compact{{/showText}}">
  {{#topLeft}}<span class="top-left">{{topLeftText}}</span>{{/topLeft}}
  {{#topRight}}<span class="top-right">{{topRightText}}</span>{{/topRight}}
  {{#bottomLeft}}<span class="bottom-left">{{bottomLeftText}}</span
  >{{/bottomLeft}} {{#bottomRight}}<span class="bottom-right"
    >{{bottomRightText}}</span
  >{{/bottomRight}} {{#icon}}
  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <symbol
      id="select-default-icon"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M7 21h10" />
      <path d="M12 21a9 9 0 0 0 9-9H3a9 9 0 0 0 9 9Z" />
      <path
        d="M11.38 12a2.4 2.4 0 0 1-.4-4.77 2.4 2.4 0 0 1 3.2-2.77 2.4 2.4 0 0 1 3.47-.63 2.4 2.4 0 0 1 3.37 3.37 2.4 2.4 0 0 1-1.1 3.7 2.51 2.51 0 0 1 .03 1.1"
      />
      <path d="m13 12 4-4" />
      <path d="M10.9 7.25A3.99 3.99 0 0 0 4 10c0 .73.2 1.41.54 2" />
    </symbol>
  </svg>
  {{/icon}}
  <div class="control">
    <button class="field" type="button">
      {{#icon}}<svg class="icon" width="16" height="16">
        <use href="#select-default-icon" /></svg
      >{{/icon}}
      {{#showText}}<span class="value">{{label}}</span>{{/showText}}
      <svg
        class="arrow"
        width="16"
        height="16"
        viewBox="0 0 16 16"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M4 6L8 10L12 6"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke="white"
        />
      </svg>
    </button>
    <div class="menu">
      <label class="search">
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.3-4.3" />
        </svg>
        <input type="text" placeholder="Buscar" />
      </label>
      <ul class="options">
        <li>
          <button type="button">
            {{#icon}}<svg class="icon" width="16" height="16">
              <use href="#select-default-icon" /></svg
            >{{/icon}}Reunião da W1
          </button>
        </li>
        <li>
          <button type="button">
            {{#icon}}<svg class="icon" width="16" height="16">
              <use href="#select-default-icon" /></svg
            >{{/icon}}Reunião com a equipe
          </button>
        </li>
        <li>
          <button type="button">
            {{#icon}}<svg class="icon" width="16" height="16">
              <use href="#select-default-icon" /></svg
            >{{/icon}}Expansão
          </button>
        </li>
        <li>
          <button type="button">
            {{#icon}}<svg class="icon" width="16" height="16">
              <use href="#select-default-icon" /></svg
            >{{/icon}}Reunião com cliente
          </button>
        </li>
      </ul>
    </div>
  </div>
</div>
<script>
  // Abre e fecha a lista, filtra pela busca e troca o valor ao escolher uma opção.
  document.querySelectorAll(".select-default").forEach((root) => {
    const value = root.querySelector(".value");
    const search = root.querySelector(".search input");
    const items = root.querySelectorAll(".options li");

    root.querySelector(".field").addEventListener("click", () => {
      root.classList.toggle("open");
      if (root.classList.contains("open")) search.focus();
    });
    items.forEach((li) => {
      li.querySelector("button").addEventListener("click", (e) => {
        if (value) value.textContent = e.currentTarget.textContent.trim();
        root.classList.remove("open");
      });
    });
    search.addEventListener("input", () => {
      const q = search.value.toLowerCase();
      items.forEach(
        (li) => (li.hidden = !li.textContent.toLowerCase().includes(q)),
      );
    });
    document.addEventListener("click", (e) => {
      if (!root.contains(e.target)) root.classList.remove("open");
    });
  });
</script>
