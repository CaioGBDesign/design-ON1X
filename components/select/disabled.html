<style>
  .select-disabled {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    width: 100%;
    max-width: 360px;

    color: #fff;
    font-family: "Public Sans";
    font-size: 12px;
    line-height: 16px;
  }
  .select-disabled .top-right,
  .select-disabled .bottom-right {
    margin-left: auto;
  }
  .select-disabled .bottom-left,
  .select-disabled .bottom-right {
    order: 1;
    color: rgba(255, 255, 255, 0.4);
  }
  .select-disabled .field {
    display: flex;
    padding: 8px;
    align-items: center;
    gap: 8px;
    align-self: stretch;
    width: 100%;

    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: rgba(255, 255, 255, 0.02);

    color: inherit;
    font: inherit;
    text-align: left;
    cursor: not-allowed;
  }
  .select-disabled .value {
    flex: 1;
  }
  .select-disabled .value,
  .select-disabled .arrow {
    color: #262626;
  }
  .select-disabled .icon,
  .select-disabled .arrow {
    flex: none;
  }
  .select-disabled .icon {
    color: #9ade7b;
  }

  /* Sem texto: o campo encolhe para o ícone e a seta */
  .select-disabled.compact {
    width: auto;
  }

  /* Light mode */
  [data-theme="light"] .select-disabled .top-left,
  [data-theme="light"] .select-disabled .top-right {
    color: #000000;
  }
  [data-theme="light"] .select-disabled .value,
  [data-theme="light"] .select-disabled .arrow {
    color: #e5e5e5;
  }
  [data-theme="light"] .select-disabled .bottom-left,
  [data-theme="light"] .select-disabled .bottom-right {
    color: #717171;
  }
  [data-theme="light"] .select-disabled .field {
    border: 1px solid rgba(0, 0, 0, 0.15);
    background: rgba(0, 0, 0, 0.02);
  }
</style>
<div class="select-disabled{{^showText}} compact{{/showText}}">
  {{#topLeft}}<span class="top-left">{{topLeftText}}</span>{{/topLeft}}
  {{#topRight}}<span class="top-right">{{topRightText}}</span>{{/topRight}}
  {{#bottomLeft}}<span class="bottom-left">{{bottomLeftText}}</span
  >{{/bottomLeft}} {{#bottomRight}}<span class="bottom-right"
    >{{bottomRightText}}</span
  >{{/bottomRight}}
  <button class="field" type="button" disabled>
    {{#icon}}
    <svg
      class="icon"
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M7 21h10" />
      <path d="M12 21a9 9 0 0 0 9-9H3a9 9 0 0 0 9 9Z" />
      <path
        d="M11.38 12a2.4 2.4 0 0 1-.4-4.77 2.4 2.4 0 0 1 3.2-2.77 2.4 2.4 0 0 1 3.47-.63 2.4 2.4 0 0 1 3.37 3.37 2.4 2.4 0 0 1-1.1 3.7 2.51 2.51 0 0 1 .03 1.1"
      />
      <path d="m13 12 4-4" />
      <path d="M10.9 7.25A3.99 3.99 0 0 0 4 10c0 .73.2 1.41.54 2" />
    </svg>
    {{/icon}}
    {{#showText}}<span class="value">{{label}}</span>{{/showText}}
    <svg
      class="arrow"
      width="16"
      height="16"
      viewBox="0 0 16 16"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        d="M4 6L8 10L12 6"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke="currentColor"
      />
    </svg>
  </button>
</div>
