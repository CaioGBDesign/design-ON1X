<style>
  .select-team {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    width: 100%;
    max-width: 360px;

    color: #fff;
    font-family: "Public Sans";
    font-size: 12px;
    line-height: 16px;
  }
  .select-team .top-right,
  .select-team .bottom-right {
    margin-left: auto;
  }
  .select-team .bottom-left,
  .select-team .bottom-right {
    order: 1;
    color: rgba(255, 255, 255, 0.4);
  }
  .select-team .control {
    position: relative;
    width: 100%;
  }
  .select-team .field {
    display: flex;
    padding: 8px;
    align-items: center;
    gap: 8px;
    width: 100%;

    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: rgba(255, 255, 255, 0.02);

    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .select-team.open .field {
    background: #000;
  }
  .select-team .spacer {
    flex: 1;
  }
  .select-team .meta {
    color: rgba(255, 255, 255, 0.2);
  }
  .select-team .arrow {
    flex: none;
    transition: transform 0.15s;
  }
  .select-team.open .arrow {
    transform: rotate(180deg);
  }

  /* Avatares */
  .select-team .avatar {
    display: inline-flex;
    flex: none;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--c, #333);
    color: #0a181c;
    font-size: 8px;
    font-weight: 600;
  }
  .select-team .stack {
    display: flex;
    flex: none;
  }
  .select-team .stack .avatar + .avatar {
    margin-left: -6px;
  }
  .select-team .stack .more {
    border: 1.5px solid #000;
    background: #333;
    color: #fff;
  }

  /* Lista de opções */
  .select-team .menu {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    right: 0;
    z-index: 10;
    flex-direction: column;
    align-items: flex-start;

    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: #000;
    box-shadow: 0 4px 10px 0 rgba(0, 0, 0, 0.15);
  }
  .select-team.open .menu {
    display: flex;
  }
  .select-team .search,
  .select-team .group {
    align-self: stretch;
  }
  .select-team .search {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.15);
  }
  .select-team .search input {
    flex: 1;
    min-width: 0;
    padding: 0;
    border: 0;
    background: none;
    color: inherit;
    font: inherit;
    outline: none;
  }
  .select-team .search input::placeholder {
    color: #fff;
  }
  .select-team .group {
    margin: 0;
    padding: 4px;
    list-style: none;
  }
  .select-team .group + .group {
    border-top: 1px solid rgba(255, 255, 255, 0.15);
  }
  .select-team .group-title {
    padding: 8px 8px 4px;
    color: rgba(255, 255, 255, 0.4);
  }
  .select-team li.bp {
    margin-bottom: 4px;
  }
  .select-team .option {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 8px;
    border: 0;
    border-radius: 6px;
    background: none;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .select-team .option:hover,
  .select-team .option:focus-visible,
  .select-team .option.selected {
    background: rgba(255, 255, 255, 0.08);
    outline: none;
  }
  .select-team .person {
    display: flex;
    flex-direction: column;
    width: 140px;
  }
  .select-team .person small {
    color: rgba(255, 255, 255, 0.4);
    font-size: inherit;
  }
  .select-team .count {
    padding: 2px 6px;
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.15);
  }
  .select-team .check {
    margin-left: auto;
    visibility: hidden;
  }
  .select-team .option.selected .check {
    visibility: visible;
  }

  /* Light mode */
  [data-theme="light"] .select-team .top-left,
  [data-theme="light"] .select-team .top-right {
    color: #000000;
  }
  [data-theme="light"] .select-team .arrow {
    color: #000000;
  }
  [data-theme="light"] .select-team .bottom-left,
  [data-theme="light"] .select-team .bottom-right {
    color: #717171;
  }
  [data-theme="light"] .select-team .field {
    border: 1px solid rgba(0, 0, 0, 0.15);
    background: rgba(0, 0, 0, 0.02);
  }
  [data-theme="light"] .select-team.open .field {
    background: #fff;
  }
  /* Lista de opções no Light */
  [data-theme="light"] .select-team .menu {
    border: 1px solid rgba(0, 0, 0, 0.15);
    background: #fff;
    color: #000;
  }
  [data-theme="light"] .select-team .search {
    border-bottom: 1px solid rgba(0, 0, 0, 0.15);
  }
  [data-theme="light"] .select-team .search input::placeholder {
    color: #717171;
  }
  [data-theme="light"] .select-team .option:hover,
  [data-theme="light"] .select-team .option:focus-visible,
  [data-theme="light"] .select-team .option.selected {
    background: rgba(0, 0, 0, 0.08);
  }
  [data-theme="light"] .select-team .group + .group {
    border-top: 1px solid rgba(0, 0, 0, 0.15);
  }
  [data-theme="light"] .select-team .group-title,
  [data-theme="light"] .select-team .person small {
    color: #717171;
  }
  [data-theme="light"] .select-team .count {
    border: 1px solid rgba(0, 0, 0, 0.15);
  }
  [data-theme="light"] .select-team .meta {
    color: #e5e5e5;
  }
</style>
<div class="select-team">
  {{#topLeft}}<span class="top-left">{{topLeftText}}</span>{{/topLeft}}
  {{#topRight}}<span class="top-right">{{topRightText}}</span>{{/topRight}}
  {{#bottomLeft}}<span class="bottom-left">{{bottomLeftText}}</span
  >{{/bottomLeft}} {{#bottomRight}}<span class="bottom-right"
    >{{bottomRightText}}</span
  >{{/bottomRight}}
  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <symbol
      id="select-team-check"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M20 6 9 17l-5-5" />
    </symbol>
  </svg>
  <div class="control">
    <button class="field" type="button">
      {{#avatars}}

        <span class="avatar" style="--c: #b9a6f2">CG</span>
        <span class="avatar" style="--c: #6aa0b8">FK</span>
        <span class="avatar" style="--c: #c9b18a">JP</span>
        <span class="avatar more">
          <svg
            width="12"
            height="12"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <path d="M5 12h14" />
            <path d="M12 5v14" />
          </svg>
        </span>
      </span>
      {{/avatars}}
      <span class="spacer"></span>
      {{#meta}}<span class="meta">{{metaText}}</span>{{/meta}}
      <svg
        class="arrow"
        width="16"
        height="16"
        viewBox="0 0 16 16"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M4 6L8 10L12 6"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke="currentColor"
        />
      </svg>
    </button>
    <div class="menu">
      <label class="search">
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"

          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.3-4.3" />
        </svg>
        <input type="text" placeholder="Buscar" />
      </label>

      <ul class="group">
        <li class="group-title">Consultores</li>
        <li class="bp">
          <button class="option selected" type="button">
            <span class="avatar" style="--c: #b9a6f2">CG</span>
            <span class="person"
              >Caio Goulart<small>modelo@w1.com.br</small></span
            >
            <span class="count">3/9</span>
            <svg class="check" width="16" height="16">
              <use href="#select-team-check" />
            </svg>
          </button>
        </li>
        <li class="bp">
          <button class="option" type="button">
            <span class="avatar" style="--c: #6aa0b8">FK</span>
            <span class="person"
              >Flavia Kawazoe<small>modelo@w1.com.br</small></span
            >
            <span class="count">3/9</span>
            <svg class="check" width="16" height="16">
              <use href="#select-team-check" />
            </svg>
          </button>
        </li>
        <li class="bp">
          <button class="option" type="button">
            <span class="avatar" style="--c: #c9b18a">JP</span>
            <span class="person"
              >Jennifer Paiva<small>modelo@w1.com.br</small></span
            >
            <span class="count">3/9</span>
            <svg class="check" width="16" height="16">
              <use href="#select-team-check" />
            </svg>
          </button>
        </li>
      </ul>

      <ul class="group">
        <li class="group-title">Estrutura</li>
        <li>
          <button class="option" type="button">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M10 12C10 13.1046 9.10457 14 8 14C6.89543 14 6 13.1046 6 12C6 10.8954 6.89543 10 8 10C9.10457 10 10 10.8954 10 12Z" stroke-linecap="round" stroke-linejoin="round" stroke="#717171" /><path d="M6 4C6 5.10457 5.10457 6 4 6C2.89543 6 2 5.10457 2 4C2 2.89543 2.89543 2 4 2C5.10457 2 6 2.89543 6 4Z" stroke-linecap="round" stroke-linejoin="round" stroke="#717171" /><path d="M14 4C14 5.10457 13.1046 6 12 6C10.8954 6 10 5.10457 10 4C10 2.89543 10.8954 2 12 2C13.1046 2 14 2.89543 14 4Z" stroke-linecap="round" stroke-linejoin="round" stroke="#717171" /><path d="M12 6V7.33333C12 7.73333 11.7333 8 11.3333 8H4.66667C4.26667 8 4 7.73333 4 7.33333V6" stroke-linecap="round" stroke-linejoin="round" stroke="#717171" /><path d="M8 8V10" stroke-linecap="round" stroke-linejoin="round" stroke="#717171" /></svg>
            Equipe direta
            <svg class="check" width="16" height="16">
              <use href="#select-team-check" />
            </svg>
          </button>
        </li>
        <li>
          <button class="option" type="button">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M14 12C14 13.1046 13.1046 14 12 14C10.8954 14 10 13.1046 10 12C10 10.8954 10.8954 10 12 10C13.1046 10 14 10.8954 14 12Z" stroke-linecap="round" stroke-linejoin="round" stroke="#717171" /><path d="M6 4C6 5.10457 5.10457 6 4 6C2.89543 6 2 5.10457 2 4C2 2.89543 2.89543 2 4 2C5.10457 2 6 2.89543 6 4Z" stroke-linecap="round" stroke-linejoin="round" stroke="#717171" /><path d="M4 14V6C4 7.5913 4.63214 9.11742 5.75736 10.2426C6.88258 11.3679 8.4087 12 10 12" stroke-linecap="round" stroke-linejoin="round" stroke="#717171" /></svg>
            Estrutura líquida
            <svg class="check" width="16" height="16">
              <use href="#select-team-check" />
            </svg>
          </button>
        </li>
        <li>
          <button class="option" type="button">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M11.3333 10.6667H14C14.3682 10.6667 14.6667 10.9651 14.6667 11.3333V14C14.6667 14.3682 14.3682 14.6667 14 14.6667H11.3333C10.9651 14.6667 10.6667 14.3682 10.6667 14V11.3333C10.6667 10.9651 10.9651 10.6667 11.3333 10.6667Z" stroke-linecap="round" stroke-linejoin="round" stroke="#717171" /><path d="M2.00001 10.6667H4.66668C5.03487 10.6667 5.33334 10.9651 5.33334 11.3333V14C5.33334 14.3682 5.03487 14.6667 4.66668 14.6667H2.00001C1.63182 14.6667 1.33334 14.3682 1.33334 14V11.3333C1.33334 10.9651 1.63182 10.6667 2.00001 10.6667Z" stroke-linecap="round" stroke-linejoin="round" stroke="#717171" /><path d="M6.66667 1.33334H9.33333C9.70152 1.33334 10 1.63182 10 2.00001V4.66668C10 5.03487 9.70152 5.33334 9.33333 5.33334H6.66667C6.29848 5.33334 6 5.03487 6 4.66668V2.00001C6 1.63182 6.29848 1.33334 6.66667 1.33334Z" stroke-linecap="round" stroke-linejoin="round" stroke="#717171" /><path d="M3.33334 10.6667V8.66667C3.33334 8.48986 3.40358 8.32029 3.52861 8.19526C3.65363 8.07024 3.8232 8 4.00001 8H12C12.1768 8 12.3464 8.07024 12.4714 8.19526C12.5964 8.32029 12.6667 8.48986 12.6667 8.66667V10.6667" stroke-linecap="round" stroke-linejoin="round" stroke="#717171" /><path d="M8 8.00001V5.33334" stroke-linecap="round" stroke-linejoin="round" stroke="#717171" /></svg>
            Estrutura bruta
            <svg class="check" width="16" height="16">

            </svg>
          </button>
        </li>
        <li>
          <button class="option" type="button">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M14 12C14 13.1046 13.1046 14 12 14C10.8954 14 10 13.1046 10 12C10 10.8954 10.8954 10 12 10C13.1046 10 14 10.8954 14 12Z" stroke-linecap="round" stroke-linejoin="round" stroke="#717171" /><path d="M6 4C6 5.10457 5.10457 6 4 6C2.89543 6 2 5.10457 2 4C2 2.89543 2.89543 2 4 2C5.10457 2 6 2.89543 6 4Z" stroke-linecap="round" stroke-linejoin="round" stroke="#717171" /><path d="M8.66666 4H10.6667C11.0203 4 11.3594 4.14048 11.6095 4.39052C11.8595 4.64057 12 4.97971 12 5.33333V10" stroke-linecap="round" stroke-linejoin="round" stroke="#717171" /><path d="M7.33333 12H5.33333C4.97971 12 4.64057 11.8595 4.39052 11.6095C4.14048 11.3594 4 11.0203 4 10.6667V6" stroke-linecap="round" stroke-linejoin="round" stroke="#717171" /></svg>
            Própria
            <svg class="check" width="16" height="16">
              <use href="#select-team-check" />
            </svg>
          </button>
        </li>
      </ul>
    </div>
  </div>
</div>
<script>
  // Abre e fecha a lista, filtra pela busca e marca ou desmarca as opções clicadas.
  document.querySelectorAll(".select-team").forEach((root) => {
    const search = root.querySelector(".search input");
    const groups = root.querySelectorAll(".group");

    root.querySelector(".field").addEventListener("click", () => {
      root.classList.toggle("open");
      if (root.classList.contains("open")) search.focus();
    });
    root.querySelectorAll(".option").forEach((option) => {
      option.addEventListener("click", () =>
        option.classList.toggle("selected"),
      );
    });
    search.addEventListener("input", () => {
      const q = search.value.toLowerCase();
      groups.forEach((group) => {
        let visible = 0;
        group.querySelectorAll("li:not(.group-title)").forEach((li) => {
          li.hidden = !li.textContent.toLowerCase().includes(q);
          if (!li.hidden) visible++;
        });
        group.hidden = !visible;
      });
    });
    document.addEventListener("click", (e) => {
      if (!root.contains(e.target)) root.classList.remove("open");
    });
  });
</script>
