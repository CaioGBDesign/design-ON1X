<style>
  .badge-neutral {
    display: flex;
    padding: 4px 8px;
    justify-content: center;
    align-items: center;
    gap: 4px;
    align-self: stretch;

    border-radius: 8px;
    background: #262626;

    color: #fff;
    text-align: center;
    font-family: "Public Sans";
    font-size: 12px;
    font-style: normal;
    font-weight: 500;
    line-height: 16px;
  }
  /* Ícone e identificador sempre na cor do texto */
  .badge-neutral .icon {
    flex: none;
  }
  .badge-neutral .avatar {
    display: block;
    width: 12px;
    height: 12px;
    flex: none;

    border-radius: 50%;
    object-fit: cover;
  }
  .badge-neutral .dot {
    width: 4px;
    height: 4px;
    flex: none;

    border-radius: 50%;
    background: currentColor;
  }
  .badge-neutral .close {
    display: flex;
    flex: none;
    padding: 0;
    border: 0;
    background: none;
    color: #fff;
    cursor: pointer;
  }

  /* Light mode */
  [data-theme="light"] .badge-neutral {
    background: #e5e5e5;
    color: #000;
  }
  [data-theme="light"] .badge-neutral .close {
    color: #000;
  }
</style>
<span class="badge-neutral">
  {{#icon}}<svg class="icon" width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M2 11V7.764M2 7.764V2C2 1.92238 2.01807 1.84582 2.05279 1.77639C2.0875 1.70697 2.1379 1.64657 2.2 1.6C2.71929 1.21053 3.35089 1 4 1C5.5 1 6.5 2 7.6665 2C8.33317 2 8.84433 1.86667 9.2 1.6C9.27428 1.54429 9.36262 1.51036 9.4551 1.50202C9.54758 1.49368 9.64055 1.51126 9.72361 1.55279C9.80666 1.59431 9.87651 1.65815 9.92533 1.73713C9.97414 1.81612 10 1.90714 10 2V7C10 7.07762 9.98193 7.15418 9.94721 7.22361C9.9125 7.29303 9.8621 7.35343 9.8 7.4C9.28071 7.78947 8.64911 8 8 8C6.5 8 5.5 7 4 7C3.26206 7.00002 2.55001 7.27202 2 7.764Z" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor" />
  </svg>{{/icon}}
  {{#avatar}}<img class="avatar" src="components/Avatar/caio.jpg" alt="Caio" />{{/avatar}}
  {{#dot}}<span class="dot"></span>{{/dot}}
  {{label}}
  {{#close}}<button class="close" type="button" aria-label="Fechar" onclick="this.closest('.badge-neutral').remove()">
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M9 3L3 9" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor" />
      <path d="M3 3L9 9" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor" />
    </svg>
  </button>{{/close}}
</span>
