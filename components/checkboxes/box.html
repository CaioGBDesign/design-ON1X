<style>
  /* Desmarcado */
  .checkbox-box {
    display: flex;
    width: 414px;
    max-width: 100%;
    box-sizing: border-box;
    padding: 20px;
    flex-direction: column;
    align-items: flex-start;
    gap: 16px;

    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.04);
    background: rgba(255, 255, 255, 0.02);

    font-family: "Public Sans";
    font-style: normal;
    font-weight: 400;
    cursor: pointer;
    transition: background 0.15s;
  }
  /* Marcado */
  .checkbox-box:has(input:checked) {
    background: rgba(43, 100, 96, 0.15);
  }
  .checkbox-box .head {
    display: flex;
    align-items: center;
    gap: 8px;
    align-self: stretch;
  }
  .checkbox-box .title {
    display: flex;
    height: 16px;
    flex-direction: column;
    justify-content: center;
    flex: 1 0 0;

    color: #fff;
    font-size: 14px;
    line-height: 20px; /* 142.857% */
  }
  .checkbox-box .description {
    align-self: stretch;

    color: #717171;
    font-size: 12px;
    line-height: normal;
  }

  /* Checkbox */
  .checkbox-box input {
    display: flex;
    width: 16px;
    height: 16px;
    flex: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    box-sizing: border-box;
    margin: 0;

    appearance: none;
    border-radius: 4px;
    border: 1px solid rgba(255, 255, 255, 0.04);
    background: #262626;
    cursor: pointer;
  }
  .checkbox-box input:checked {
    background: #5fddd3 url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2712%27 height=%2712%27 viewBox=%270 0 12 12%27 fill=%27none%27%3E%3Cpath d=%27M10 3L4.5 8.5L2 6%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27 stroke=%27%230A181C%27/%3E%3C/svg%3E") no-repeat center;
  }
  .checkbox-box input:focus-visible {
    outline: 2px solid #5fddd3;
    outline-offset: 2px;
  }

  /* Light mode */
  [data-theme="light"] .checkbox-box {
    border: 1px solid rgba(0, 0, 0, 0.04);
    background: rgba(0, 0, 0, 0.02);
  }
  [data-theme="light"] .checkbox-box:has(input:checked) {
    background: rgba(10, 24, 28, 0.05);
  }
  [data-theme="light"] .checkbox-box .title {
    color: #000;
  }
  [data-theme="light"] .checkbox-box input {
    border: 1px solid rgba(0, 0, 0, 0.04);
  }
  [data-theme="light"] .checkbox-box input:not(:checked) {
    background: #e5e5e5;
  }
</style>
<label class="checkbox-box">
  <span class="head">
    <input type="checkbox"{{#checked}} checked{{/checked}} />
    <span class="title">{{title}}</span>
  </span>
  {{#showDescription}}<span class="description">{{description}}</span>{{/showDescription}}
</label>
