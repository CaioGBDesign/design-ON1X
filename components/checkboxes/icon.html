<style>
  /* Botão desmarcado */
  .checkbox-icon {
    position: relative;
    display: inline-flex;
    padding: 8px;
    justify-content: center;
    align-items: center;
    gap: 8px;
    box-sizing: border-box;

    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: rgba(255, 255, 255, 0.02);

    color: #fff;
    font-family: "Public Sans";
    font-size: 12px;
    font-style: normal;
    font-weight: 400;
    line-height: normal;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  /* Botão marcado */
  .checkbox-icon:has(input:checked) {
    background: rgba(43, 100, 96, 0.15);
    color: #5fddd3;
  }
  .checkbox-icon:has(input:focus-visible) {
    outline: 2px solid #5fddd3;
    outline-offset: 2px;
  }
  /* O checkbox fica invisível, mas segue funcionando com clique e teclado */
  .checkbox-icon input {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: 0;
    opacity: 0;
  }
  .checkbox-icon svg {
    flex: none;
  }

  /* Light mode */
  [data-theme="light"] .checkbox-icon {
    border: 1px solid rgba(0, 0, 0, 0.15);
    background: rgba(0, 0, 0, 0.02);
    color: #000;
  }
  [data-theme="light"] .checkbox-icon:has(input:checked) {
    background: rgba(10, 24, 28, 0.05);
    color: #5fddd3;
  }
</style>
<label class="checkbox-icon">
  <input type="checkbox"{{#checked}} checked{{/checked}} />
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="3" y="3" width="18" height="18" rx="2" />
    <path d="M9 3v2" />
    <path d="M9 9v1" />
    <path d="M9 14v1" />
    <path d="M9 19v2" />
  </svg>
  {{label}}
</label>
