<style>
.ds-badge {
  display: inline-flex; align-items: center; gap: 6px;
  font: 600 var(--ds-text-sm)/1 var(--ds-font);
  padding: 6px 10px; border-radius: var(--ds-radius-pill);
}
.ds-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.ds-badge--success { color: var(--ds-success); background: color-mix(in srgb, var(--ds-success) 14%, transparent); }
.ds-badge--warning { color: var(--ds-warning); background: color-mix(in srgb, var(--ds-warning) 14%, transparent); }
.ds-badge--danger  { color: var(--ds-danger);  background: color-mix(in srgb, var(--ds-danger) 14%, transparent); }
</style>
<span class="ds-badge ds-badge--{{status}}">{{label}}</span>
